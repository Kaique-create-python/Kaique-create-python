name: FreedroidRPG WASM - experimental compilation
on:
  push:
    branches: [freedroid-web-port]
    paths: ['.github/workflows/freedroid-web.yml', 'freedroid-web/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/freedroid-web.yml', 'freedroid-web/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    if: github.event_name != 'pull_request' || github.head_ref == 'freedroid-web-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            freedroid-web
            .github/workflows/freedroid-web.yml
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake autopoint gettext pkg-config
      - name: Check script syntax
        run: bash -n freedroid-web/build.sh
      - name: Compile original source
        run: |
          cd freedroid-web
          bash build.sh
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedroid-diagnostics
          if-no-files-found: warn
          path: |
            freedroid-web/work/*.log
            freedroid-web/work/source/config.log
      - name: Game build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freedroid-web-build
          path: freedroid-web/dist/
