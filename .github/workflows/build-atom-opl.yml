name: Build ATOM OPL v0.2

on:
  push:
    branches:
      - atom-opl-dev
    paths:
      - "atom-opl/**"
      - ".github/workflows/build-atom-opl.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Checkout ATOM project
        uses: actions/checkout@v4

      - name: Clone official OPL
        run: |
          git clone --depth=1 https://github.com/ps2homebrew/Open-PS2-Loader.git

      - name: Apply ATOM OPL patches
        run: |
          python3 atom-opl/scripts/prepare_opl.py

      - name: Build ATOM OPL
        working-directory: Open-PS2-Loader
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Open-PS2-Loader"
          make LOCALVERSION=ATOM-OPL-v0.2 NOT_PACKED=1
          cp opl.elf ../ATOM-OPL-v0.2.ELF

      - name: Verify ELF
        run: |
          ls -lh ATOM-OPL-v0.2.ELF
          file ATOM-OPL-v0.2.ELF || true

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ATOM-OPL-v0.2
          path: ATOM-OPL-v0.2.ELF
          retention-days: 7
