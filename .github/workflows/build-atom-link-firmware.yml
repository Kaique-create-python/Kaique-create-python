name: Build ATOM Link firmware v0.6-NAPT

on:
  push:
    branches:
      - atom-opl-dev
    paths:
      - "atom-opl/firmware/**"
      - ".github/workflows/build-atom-link-firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: atom-opl/firmware/atom_bridge
        run: pio run

      - name: Collect and merge binaries
        shell: bash
        run: |
          set -e
          mkdir -p out

          BUILD="atom-opl/firmware/atom_bridge/.pio/build/atom_echo"

          cp "$BUILD/firmware.bin" out/ATOM-Link-v0.6-NAPT-firmware.bin
          cp "$BUILD/bootloader.bin" out/ATOM-Link-v0.6-NAPT-bootloader.bin
          cp "$BUILD/partitions.bin" out/ATOM-Link-v0.6-NAPT-partitions.bin

          # PioArduino 3.x already generates a factory image containing
          # bootloader + partition table + boot_app0 + application.
          test -f "$BUILD/firmware.factory.bin"
          cp "$BUILD/firmware.factory.bin" out/ATOM-Link-v0.6-NAPT-FULL.bin

          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ATOM-Link-v0.6-NAPT-firmware
          path: out/*
          retention-days: 7
