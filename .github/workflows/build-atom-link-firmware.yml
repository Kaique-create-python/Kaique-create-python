name: Build ATOM Link firmware v0.2

on:
  push:
    branches:
      - atom-opl-dev
    paths:
      - "atom-opl/firmware/**"
      - ".github/workflows/build-atom-link-firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: atom-opl/firmware/atom_bridge
        run: pio run

      - name: Collect and merge binaries
        shell: bash
        run: |
          set -e
          mkdir -p out

          BUILD="atom-opl/firmware/atom_bridge/.pio/build/atom_echo"

          cp "$BUILD/firmware.bin" out/ATOM-Link-v0.2-firmware.bin
          cp "$BUILD/bootloader.bin" out/ATOM-Link-v0.2-bootloader.bin
          cp "$BUILD/partitions.bin" out/ATOM-Link-v0.2-partitions.bin

          BOOTAPP="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)"
          ESPTOOL="$(find "$HOME/.platformio/packages" -path "*/tool-esptoolpy/esptool.py" | head -n 1)"

          echo "boot_app0=$BOOTAPP"
          echo "esptool=$ESPTOOL"

          test -n "$BOOTAPP"
          test -n "$ESPTOOL"

          python "$ESPTOOL" --chip esp32 merge_bin \
            -o out/ATOM-Link-v0.2-FULL.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$BUILD/firmware.bin"

          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ATOM-Link-v0.2-firmware
          path: out/*
          retention-days: 7
