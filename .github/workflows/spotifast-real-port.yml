name: Import full SpotiFast source and Android port check
on:
  push:
    branches: [spotifast-real-android-port]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import complete official v0.14.1 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f spotifast/Cargo.toml ]; then
            git clone --depth 1 --branch v0.14.1 https://github.com/crmne/spotifast.git spotifast
            git -C spotifast rev-parse HEAD | tee SPOTIFAST_UPSTREAM_COMMIT.txt
            rm -rf spotifast/.git
            git add -f spotifast SPOTIFAST_UPSTREAM_COMMIT.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import official SpotiFast v0.14.1 source for real Android port"
            git push origin HEAD:spotifast-real-android-port
          fi
          grep -q '^version = "0.14.1"' spotifast/Cargo.toml
          find spotifast/src -type f | wc -l
      - run: tar -czf spotifast-v0.14.1-android-port-source.tar.gz spotifast SPOTIFAST_UPSTREAM_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Full-Spotifast-0141-Android-Port-Working-Tree
          path: spotifast-v0.14.1-original-source.tar.gz
          retention-days: 30
  android-target-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check imported Android port source
        run: test -f spotifast/src/android.rs
      - run: |
          rustup toolchain install stable --profile minimal
          rustup +stable target add aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cross-check original source for Android arm64
        shell: bash
        run: |
          set -uo pipefail
          echo "Rust version: $(rustc +stable --version)" | tee android-port-audit.log
          echo "Official v0.14.1 desktop sources" | tee -a android-port-audit.log
          ndkroot="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk"
          ndkdir=$(find "$ndkroot" -maxdepth 1 -type d -name '[0-9]*' 2>/dev/null | sort -V | tail -n1)
          if [ -n "$ndkdir" ]; then
            export PATH="$ndkdir/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
            export CC_aarch64_linux_android=aarch64-linux-android24-clang
            export AR_aarch64_linux_android=llvm-ar
          fi
          export CARGO_BUILD_JOBS=4
          set +e
          (cd spotifast && cargo +stable check --lib --target aarch64-linux-android --no-default-features) 2>&1 | tee -a android-port-audit.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "Android cross-compilation exit code: $rc" | tee -a android-port-audit.log
          echo "$rc" > android-compile-exit-code.txt
      - name: Build native Rust APK if compile check passed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat android-compile-exit-code.txt)" != "0" ]; then
            echo "Original Rust port does not yet pass ARM64 cargo check; no misleading APK will be produced."
            exit 0
          fi
          ndkdir=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -maxdepth 1 -type d -name '[0-9]*' 2>/dev/null | sort -V | tail -n1)
          export PATH="$ndkdir/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_BUILD_JOBS=4
          (cd spotifast && cargo +stable build --release --lib --target aarch64-linux-android --no-default-features)
          LIB="spotifast/target/aarch64-linux-android/release/libspotifast.so"
          test -s "$LIB"
          mkdir -p port-android/android/app/src/main/jniLibs/arm64-v8a
          cp "$LIB" port-android/android/app/src/main/jniLibs/arm64-v8a/libspotifast.so
          echo "Native Rust engine $(du -h "$LIB")"
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          cd port-android/android
          gradle --version
          gradle :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpotiFast-Rust-Android-APK
          path: port-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real-SpotiFast-Android-Compiler-Report
          path: android-port-audit.log
          retention-days: 30
