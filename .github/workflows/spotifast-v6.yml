name: SpotiFast Android V6
on:
  push:
    branches: [spotifast-android-v6]
    paths: ['port-android/**', 'spotifast/**', '.github/workflows/spotifast-v6.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spotifast-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Unit tests and Android lint
        timeout-minutes: 12
        working-directory: port-android/android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --info --no-daemon --console=plain
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 320
            (cd port-android/android && gradle :app:connectedDebugAndroidTest --stacktrace --console=plain)
            # The Android Test Orchestrator can uninstall the target APK after
            # tests. Install the just-built APK explicitly for smoke testing.
            adb install -r port-android/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path dev.edith.spotifast
            adb shell am force-stop dev.edith.spotifast
            adb shell am start -W -n dev.edith.spotifast/.FreeMusicActivity > port-android/android/startup.txt
            adb shell dumpsys meminfo dev.edith.spotifast > port-android/android/memory.txt
            adb shell dumpsys gfxinfo dev.edith.spotifast > port-android/android/frames.txt
            adb shell screencap -p /sdcard/spotifast-home.png
            adb pull /sdcard/spotifast-home.png port-android/android/spotifast-home.png
            adb logcat -d -s AndroidRuntime > port-android/android/runtime-errors.txt
      - name: Live provider checks
        timeout-minutes: 4
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: python3 port-android/scripts/check_providers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpotiFast-V6-test-reports
          path: |
            port-android/android/app/build/reports
            port-android/android/app/build/outputs/androidTest-results
            provider-checks.json
            port-android/android/memory.txt
            port-android/android/frames.txt
            port-android/android/startup.txt
            port-android/android/spotifast-home.png
            port-android/android/runtime-errors.txt
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup +stable target add aarch64-linux-android
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spotifast
          key: android-arm64-v6
      - name: Build original Rust ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_BUILD_JOBS=4
          cd spotifast
          cargo +stable build --release --lib --target aarch64-linux-android --no-default-features
          cd ..
          mkdir -p port-android/android/app/src/main/jniLibs/arm64-v8a
          cp spotifast/target/aarch64-linux-android/release/libspotifast.so port-android/android/app/src/main/jniLibs/arm64-v8a/
          llvm-readelf -h port-android/android/app/src/main/jniLibs/arm64-v8a/libspotifast.so | grep AArch64
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOTIFAST_KEYSTORE_BASE64 }}
          SPOTIFAST_STORE_PASSWORD: ${{ secrets.SPOTIFAST_STORE_PASSWORD }}
          SPOTIFAST_KEY_ALIAS: ${{ secrets.SPOTIFAST_KEY_ALIAS }}
          SPOTIFAST_KEY_PASSWORD: ${{ secrets.SPOTIFAST_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            export SPOTIFAST_KEYSTORE_PATH="$RUNNER_TEMP/spotifast-signing.jks"
            trap 'rm -f "$SPOTIFAST_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SPOTIFAST_KEYSTORE_PATH"
            chmod 600 "$SPOTIFAST_KEYSTORE_PATH"
            (cd port-android/android && gradle :app:assembleRelease)
            cp port-android/android/app/build/outputs/apk/release/app-release.apk dist/SpotiFast-Android-V6-arm64.apk
            echo 'Assinatura estável fornecida pelos secrets do repositório.' > dist/signature.txt
          else
            (cd port-android/android && gradle :app:assembleDebug)
            cp port-android/android/app/build/outputs/apk/debug/app-debug.apk dist/SpotiFast-Android-V6-arm64.apk
            echo 'PREVIEW DE TESTE: assinatura debug temporária do runner. Não garante atualização de APKs anteriores. Configure os secrets de assinatura para distribuição estável.' > dist/signature.txt
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/SpotiFast-Android-V6-arm64.apk > dist/signature-verification.txt
          python3 port-android/scripts/verify_apk.py dist/SpotiFast-Android-V6-arm64.apk
          (cd dist && sha256sum SpotiFast-Android-V6-arm64.apk > SpotiFast-Android-V6-arm64.apk.sha256)
          cp port-android/docs/V6-STATUS.md dist/CHANGELOG-LIMITATIONS.md
      - uses: actions/upload-artifact@v4
        with:
          name: SpotiFast-V6-arm64
          path: dist/
          if-no-files-found: error
  publish-preview:
    needs: [android-tests, native-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpotiFast-V6-arm64
          path: dist
      - name: Publish tested preview with real APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cat dist/CHANGELOG-LIMITATIONS.md dist/signature.txt > dist/release-notes.md
          gh release create "spotifast-android-v6-experimental3-build${BUILD}" --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title "SpotiFast Android V6 experimental 3 (build ${BUILD})" --notes-file dist/release-notes.md dist/SpotiFast-Android-V6-arm64.apk dist/SpotiFast-Android-V6-arm64.apk.sha256 dist/signature-verification.txt

