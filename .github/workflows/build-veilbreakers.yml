name: Build VEILBREAKERS APK

on:
  workflow_dispatch:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

concurrency:
  group: veilbreakers-apk-v170-reviewed
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'veilbreakers-apk-build'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sprite validation tools
        run: python -m pip install Pillow==11.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        shell: pwsh
        run: |
          $sdk = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdk) {
            & $sdk "platforms;android-35" "build-tools;35.0.0"
          }
      - name: Decode character frames
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/kael_frames_v03.zip.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\kael_frames_v03.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\kael_frames_v03.zip" $dest
      - name: Decode v0.8 UI assets
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/ui_v08.zip.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ui_v08.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\ui_v08.zip" $dest
          if (!(Test-Path "$dest/ui/hud_hp_frame.png")) { throw "HUD assets missing" }
          if (!(Test-Path "$dest/ui/status_attr_block.png")) { throw "Status assets missing" }
      - name: Decode cropped menu video
        shell: pwsh
        run: |
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/menu_background_v08.mp4.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          $raw = "veilbreakers-prototype/app/src/main/res/raw"
          New-Item -ItemType Directory -Force -Path $raw | Out-Null
          [IO.File]::WriteAllBytes("$raw\menu_background.mp4", [Convert]::FromBase64String($b64))
      - name: Decode v1.3 gameplay and recovery assets
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/v13_assets.zip.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v13_assets.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\v13_assets.zip" $dest
          if (!(Test-Path "$dest/kael_v13/side/run_left_0.png")) { throw "v1.3 side movement assets missing" }
          if (!(Test-Path "$dest/ui_v13/joystick_base.png")) { throw "v1.3 joystick assets missing" }
          if (!(Test-Path "$dest/ui_v13/attack_normal.png")) { throw "v1.3 attack button assets missing" }
          if (!(Test-Path "$dest/enemy_v13/idle_front_0.png")) { throw "v1.3 enemy assets missing" }
          if (!(Test-Path "$dest/project_archive/HISTORIA_COMPLETA.txt")) { throw "project archive story missing" }
          if (!(Test-Path "$dest/project_archive/SPRITES_MANIFEST.json")) { throw "project archive manifest missing" }

      - name: Decode v1.4 animation review assets
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/v14_assets.zip.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v14_assets.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\v14_assets.zip" $dest
          if (!(Test-Path "$dest/kael_v14/side/walk_left_0.png")) { throw "v1.4 walk assets missing" }
          if (!(Test-Path "$dest/kael_v14/side/run_left_0.png")) { throw "v1.4 run assets missing" }
          if (!(Test-Path "$dest/kael_v14/combo/left_c1_0.png")) { throw "v1.4 combo assets missing" }
          if (!(Test-Path "$dest/enemy_v14/idle_front_0.png")) { throw "v1.4 enemy assets missing" }
          if (!(Test-Path "$dest/project_archive/source_sheets/kael_combo_v14_source.png")) { throw "v1.4 source sheets missing" }

      - name: Re-cut v1.4 combo cells from clean source sheet
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $dest = "veilbreakers-prototype/app/src/main/assets/kael_v14/combo"
          $source = "veilbreakers-prototype/app/src/main/assets/project_archive/source_sheets/kael_combo_v14_source.png"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (!(Test-Path $source)) { throw "Kael combo source sheet missing" }

          $frames = @(
            @{ Name="right_c1_0.png"; X=35;  Y=15;  W=280; H=185; AX=210;  AY=190 },
            @{ Name="right_c1_1.png"; X=400; Y=20;  W=515; H=185; AX=625;  AY=190 },
            @{ Name="right_c1_2.png"; X=925; Y=15;  W=485; H=190; AX=1145; AY=190 },
            @{ Name="right_c2_0.png"; X=55;  Y=205; W=275; H=205; AX=205;  AY=398 },
            @{ Name="right_c2_1.png"; X=455; Y=200; W=535; H=215; AX=655;  AY=398 },
            @{ Name="right_c2_2.png"; X=960; Y=230; W=455; H=185; AX=1130; AY=398 },
            @{ Name="right_c3_0.png"; X=0;   Y=420; W=380; H=172; AX=205;  AY=575 },
            @{ Name="right_c3_1.png"; X=385; Y=420; W=610; H=172; AX=690;  AY=575 },
            @{ Name="right_c3_2.png"; X=930; Y=420; W=505; H=172; AX=1190; AY=575 },
            @{ Name="left_c1_0.png";  X=80;  Y=600; W=260; H=160; AX=200;  AY=725 },
            @{ Name="left_c1_1.png";  X=420; Y=600; W=490; H=160; AX=650;  AY=725 },
            @{ Name="left_c1_2.png";  X=920; Y=600; W=470; H=160; AX=1160; AY=725 },
            @{ Name="left_c2_0.png";  X=80;  Y=760; W=255; H=165; AX=200;  AY=910 },
            @{ Name="left_c2_1.png";  X=370; Y=760; W=550; H=165; AX=650;  AY=910 },
            @{ Name="left_c2_2.png";  X=910; Y=760; W=465; H=165; AX=1145; AY=910 },
            @{ Name="left_c3_0.png";  X=30;  Y=940; W=335; H=135; AX=205;  AY=1055 },
            @{ Name="left_c3_1.png";  X=385; Y=940; W=530; H=135; AX=650;  AY=1055 },
            @{ Name="left_c3_2.png";  X=915; Y=940; W=510; H=135; AX=1145; AY=1055 }
          )

          $src = [System.Drawing.Bitmap]::FromFile($source)
          try {
            foreach ($f in $frames) {
              $canvas = [System.Drawing.Bitmap]::new(700, 240, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $g = [System.Drawing.Graphics]::FromImage($canvas)
              try {
                $g.Clear([System.Drawing.Color]::Transparent)
                $srcRect = [System.Drawing.Rectangle]::new($f.X, $f.Y, $f.W, $f.H)
                $dx = 350 - ($f.AX - $f.X)
                $dy = 220 - ($f.AY - $f.Y)
                $dstRect = [System.Drawing.Rectangle]::new($dx, $dy, $f.W, $f.H)
                $g.DrawImage($src, $dstRect, $srcRect, [System.Drawing.GraphicsUnit]::Pixel)
                $canvas.Save((Join-Path $dest $f.Name), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $g.Dispose()
                $canvas.Dispose()
              }
            }
          } finally {
            $src.Dispose()
          }

          $check = Get-ChildItem "$dest/*.png"
          if ($check.Count -lt 18) { throw "Corrected combo frames were not generated" }

      - name: Decode v1.5 dedicated vertical combo assets
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/v15_combo_q256.zip.b64.part-*" | Sort-Object Name
          if ($parts.Count -lt 6) { throw "v1.5 vertical combo base64 parts missing" }
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v15_combo_q256.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\v15_combo_q256.zip" $dest
          $required = @(
            "$dest/kael_v15/combo/down_c1_0.png",
            "$dest/kael_v15/combo/down_c2_1.png",
            "$dest/kael_v15/combo/down_c3_2.png",
            "$dest/kael_v15/combo/up_c1_0.png",
            "$dest/kael_v15/combo/up_c2_1.png",
            "$dest/kael_v15/combo/up_c3_2.png"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing v1.5 vertical combo frame: $file" }
          }
          $count = (Get-ChildItem "$dest/kael_v15/combo/*.png").Count
          if ($count -ne 18) { throw "Expected exactly 18 v1.5 vertical combo frames, found $count" }

      - name: Decode v1.6.1 Arcana cast and orb sheets
        shell: pwsh
        run: |
          $assetRoot = "veilbreakers-prototype/app/src/main/assets"
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/v161_magic_sheets.zip.b64.part-*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 v1.6.1 magic base64 parts, found $($parts.Count)" }
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          $zip = "$env:RUNNER_TEMP\v161_magic_sheets.zip"
          $tmp = "$env:RUNNER_TEMP\v161_magic_sheets"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          Expand-Archive -Force $zip $tmp

          New-Item -ItemType Directory -Force -Path "$assetRoot/kael_v16" | Out-Null
          New-Item -ItemType Directory -Force -Path "$assetRoot/fx_v16" | Out-Null
          Copy-Item "$tmp/kael_arcana_cast_v161.png" "$assetRoot/kael_v16/magic_cast_sheet.png" -Force
          Copy-Item "$tmp/arcana_orb_v161.png" "$assetRoot/fx_v16/arcana_orb_sheet.png" -Force

          if (!(Test-Path "$assetRoot/kael_v16/magic_cast_sheet.png")) { throw "Missing Kael Arcana cast sheet" }
          if (!(Test-Path "$assetRoot/fx_v16/arcana_orb_sheet.png")) { throw "Missing Arcana orb sheet" }

      - name: Refresh embedded recovery context
        shell: pwsh
        run: |
          $archive = "veilbreakers-prototype/app/src/main/assets/project_archive"
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          Copy-Item "veilbreakers-prototype/VEILBREAKERS_CONTEXTO.txt" "$archive/CHAT_CONTEXTO_ATUAL.txt" -Force
          Set-Content "$archive/BUILD_VERSION.txt" "VEILBREAKERS v1.6.1"
          @'
          {
            "version": "1.6.1",
            "hotfix": [
              "use kael_v14 combo frames",
              "map six attack timing slices to three visual frames",
              "normalize visible side-animation height and feet baseline",
              "use separate walk/run side cycles",
              "re-cut all 18 lateral combo frames from the clean v1.4 source sheet",
              "anchor lateral combo body to a fixed foot pivot instead of slash VFX bounds",
              "extend the three-hit combo combat chain to UP and DOWN",
              "load 18 dedicated generated vertical combo frames for UP and DOWN",
              "use the same fixed 700x240 combo canvas and authored foot pivot in all four directions",
              "preserve vertical combo assets inside the APK project archive",
              "add Arcana VIII as the first Mana-powered ranged ability",
              "add Mana cost, cooldown, projectile hit detection and gradual Mana regeneration",
              "add a dedicated procedural Arcana button without new binary UI dependencies",
              "replace procedural cast/projectile visuals with generated Arcana VIII sprite animation",
              "load 12 Kael cast poses from a 4x3 sheet and 6 orb lifecycle frames from a 2x3 sheet",
              "delay projectile release until the cast release pose",
              "show animated travel/pulse orb and dedicated impact frame"
            ]
          }
          '@ | Set-Content "$archive/SPRITES_MANIFEST_V161.json"

          $v15Archive = Join-Path $archive "v15_vertical_combo_frames"
          New-Item -ItemType Directory -Force -Path $v15Archive | Out-Null
          Copy-Item "veilbreakers-prototype/app/src/main/assets/kael_v15/combo/*.png" $v15Archive -Force
          Compress-Archive -Path "$v15Archive/*.png" -DestinationPath "$archive/v15_vertical_combo_frames.zip" -Force

          Add-Type -AssemblyName System.Drawing
          $sheetDir = Join-Path $archive "source_sheets"
          New-Item -ItemType Directory -Force -Path $sheetDir | Out-Null
          foreach ($direction in @("down", "up")) {
            $sheet = [System.Drawing.Bitmap]::new(2100, 720, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($sheet)
            try {
              $g.Clear([System.Drawing.Color]::Transparent)
              for ($stage = 1; $stage -le 3; $stage++) {
                for ($pose = 0; $pose -lt 3; $pose++) {
                  $path = "veilbreakers-prototype/app/src/main/assets/kael_v15/combo/${direction}_c${stage}_${pose}.png"
                  $img = [System.Drawing.Bitmap]::FromFile($path)
                  try {
                    $g.DrawImageUnscaled($img, $pose * 700, ($stage - 1) * 240)
                  } finally {
                    $img.Dispose()
                  }
                }
              }
              $sheet.Save((Join-Path $sheetDir "kael_combo_${direction}_v15_source.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $g.Dispose()
              $sheet.Dispose()
            }
          }

          Copy-Item "veilbreakers-prototype/app/src/main/assets/kael_v16/magic_cast_sheet.png" "$sheetDir/kael_arcana_cast_v161_source.png" -Force
          Copy-Item "veilbreakers-prototype/app/src/main/assets/fx_v16/arcana_orb_sheet.png" "$sheetDir/arcana_orb_v161_source.png" -Force

          $magicArchive = Join-Path $archive "v161_arcana_assets"
          New-Item -ItemType Directory -Force -Path $magicArchive | Out-Null
          Copy-Item "veilbreakers-prototype/app/src/main/assets/kael_v16/magic_cast_sheet.png" "$magicArchive/kael_arcana_cast_v161.png" -Force
          Copy-Item "veilbreakers-prototype/app/src/main/assets/fx_v16/arcana_orb_sheet.png" "$magicArchive/arcana_orb_v161.png" -Force
          Compress-Archive -Path "$magicArchive/*.png" -DestinationPath "$archive/v161_arcana_assets.zip" -Force

          $sources = Get-ChildItem "$archive/source_sheets/*_v14_source.png"
          if ($sources.Count -gt 0) {
            Compress-Archive -Path $sources.FullName -DestinationPath "$archive/v14_source_sheets.zip" -Force
          }

      # Overlay after the legacy recovery step: it writes the old version and
      # archive files, which must never replace the final reviewed v1.7 set.
      - name: Decode v1.7 reviewed sprites and recovery archive
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/v17_reviewed_art.zip.b64.part-*" | Sort-Object Name
          if ($parts.Count -lt 1) { throw "v1.7 reviewed art base64 parts missing" }
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          $zip = "$env:RUNNER_TEMP\v17_reviewed_art.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          Expand-Archive -Force $zip $dest
          if (!(Test-Path "$dest/project_archive/SPRITES_MANIFEST_V170.json")) { throw "v1.7 sprite manifest missing" }
          if (!(Select-String -Path "$dest/project_archive/BUILD_VERSION.txt" -Pattern "1.7.0" -Quiet)) { throw "v1.7 recovery archive version missing" }

      - name: Validate all 180 authored runtime frames
        run: python veilbreakers-prototype/tools/validate_v17_assets.py

      - name: Build debug APK
        working-directory: veilbreakers-prototype
        shell: pwsh
        run: gradle --no-daemon assembleDebug

      - name: Verify and package the APK and visual sources
        shell: pwsh
        run: |
          $release = "veilbreakers-prototype/release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk" "$release/VEILBREAKERS_v1.7.0_Codex.apk" -Force
          Copy-Item "veilbreakers-prototype/VEILBREAKERS_CONTEXTO.txt" "$release/VEILBREAKERS_CONTEXTO.txt" -Force
          Copy-Item "veilbreakers-prototype/app/src/main/assets/project_archive/V17_ASSET_QA.json" "$release/V17_ASSET_QA.json" -Force
          python veilbreakers-prototype/tools/verify_apk_v17.py "$release/VEILBREAKERS_v1.7.0_Codex.apk" --output "$release/V17_APK_QA.json"
          if ($LASTEXITCODE -ne 0) { throw "APK asset/version verification failed" }
          @'
          from pathlib import Path
          import zipfile
          assets = Path("veilbreakers-prototype/app/src/main/assets")
          output = Path("veilbreakers-prototype/release/VEILBREAKERS_v1.7.0_Arte.zip")
          roots = [assets / name for name in (
              "kael_v17", "enemy_v17", "fx_v17", "project_archive/source_sheets/v17",
              "project_archive/previews/v17", "project_archive/baseline_v161_audit")]
          files = {path for root in roots for path in root.rglob("*") if path.is_file()}
          archive = assets / "project_archive"
          files.update(path for path in archive.iterdir() if path.is_file() and path.suffix in (".json", ".txt", ".md"))
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as package:
              for path in sorted(files):
                  package.write(path, path.relative_to(assets).as_posix())
          print(f"Archived {len(files)} files with reconstructible asset-relative paths: {output}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Visual archive packaging failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v1.7.0-package
          path: veilbreakers-prototype/release/
          if-no-files-found: error

  runtime_visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime review tools
        run: python -m pip install Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: veilbreakers-v1.7.0-package
          path: release
      # GitHub's Linux runners expose /dev/kvm. These permissions are the
      # emulator-runner project's documented setup for hardware acceleration.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture every authored frame in the Android renderer
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python veilbreakers-prototype/tools/capture_android_review.py --apk release/VEILBREAKERS_v1.7.0_Codex.apk --output runtime-review
      - name: Upload Android screenshots, contact sheets and animation video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v1.7.0-runtime-review
          path: runtime-review/
          if-no-files-found: warn
      # Compact review evidence is also preserved on the mandatory branch so
      # it can be inspected through GitHub without downloading a large APK.
      # qa/** is outside this workflow's push paths and cannot trigger a loop.
      - name: Archive runtime contact sheets on the build branch
        if: always() && github.ref_name == 'veilbreakers-apk-build'
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import shutil
          source = Path("runtime-review")
          target = Path("qa/v17")
          target.mkdir(parents=True, exist_ok=True)
          for old in target.glob("runtime_*.jpg"):
              old.unlink()
          for path in (source / "contacts").glob("*.jpg"):
              if path.stat().st_size > 2_000_000:
                  raise ValueError(f"Contact sheet exceeds review-file size limit: {path}")
              shutil.copy2(path, target / path.name)
          for name in ("runtime_summary.json", "logcat.txt"):
              if (source / name).is_file():
                  shutil.copy2(source / name, target / name)
          (target / "runtime_origin.json").write_text(json.dumps({
              "branch": os.environ["BUILD_BRANCH"], "buildCommit": os.environ["BUILD_COMMIT"],
              "runId": os.environ["BUILD_RUN"], "source": "Actual Android API 29 emulator screenshots"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/v17
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive VEILBREAKERS v1.7 Android visual review"
          git pull --rebase origin "$BUILD_BRANCH"
          git push origin "HEAD:$BUILD_BRANCH"
