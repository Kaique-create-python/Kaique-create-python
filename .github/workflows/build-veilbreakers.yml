name: Build VEILBREAKERS APK

on:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

concurrency:
  group: veilbreakers-apk-v03
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode clean animation frames
        shell: bash
        run: |
          mkdir -p veilbreakers-prototype/app/src/main/assets
          cat veilbreakers-prototype/app/src/main/assets_b64/kael_frames_v03.zip.b64.part-* | base64 -d > /tmp/kael_frames_v03.zip
          unzip -o /tmp/kael_frames_v03.zip -d veilbreakers-prototype/app/src/main/assets
          test -f veilbreakers-prototype/app/src/main/assets/kael/move/move_r0_f0.png
          test -f veilbreakers-prototype/app/src/main/assets/kael/attack/attack_right_5.png
      - name: Build debug APK
        working-directory: veilbreakers-prototype
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v0.3-apk
          path: veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error