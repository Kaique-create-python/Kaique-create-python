name: Build VEILBREAKERS APK

on:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

concurrency:
  group: veilbreakers-apk-v02
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Decode sprite assets
        shell: bash
        run: |
          mkdir -p veilbreakers-prototype/app/src/main/assets
          cat veilbreakers-prototype/app/src/main/assets_b64/move_sheet.png.b64.part-* | base64 -D > veilbreakers-prototype/app/src/main/assets/move_sheet.png || cat veilbreakers-prototype/app/src/main/assets_b64/move_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/move_sheet.png
          cat veilbreakers-prototype/app/src/main/assets_b64/attack_sheet.png.b64.part-* | base64 -D > veilbreakers-prototype/app/src/main/assets/attack_sheet.png || cat veilbreakers-prototype/app/src/main/assets_b64/attack_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/attack_sheet.png
          cat veilbreakers-prototype/app/src/main/assets_b64/magic_sheet.png.b64.part-* | base64 -D > veilbreakers-prototype/app/src/main/assets/magic_sheet.png || cat veilbreakers-prototype/app/src/main/assets_b64/magic_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/magic_sheet.png
      - name: Build debug APK
        working-directory: veilbreakers-prototype
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v0.2-apk
          path: veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
