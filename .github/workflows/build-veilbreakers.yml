name: Build VEILBREAKERS APK

on:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

concurrency:
  group: veilbreakers-apk-v02
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        shell: pwsh
        run: |
          $sdk = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdk) {
            & $sdk "platforms;android-35" "build-tools;35.0.0"
          }
      - name: Decode sprite assets
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $sets = @("move_sheet.png","attack_sheet.png","magic_sheet.png")
          foreach ($name in $sets) {
            $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/$name.b64.part-*" | Sort-Object Name
            $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
            [IO.File]::WriteAllBytes((Join-Path $dest $name), [Convert]::FromBase64String($b64))
          }
      - name: Build debug APK
        working-directory: veilbreakers-prototype
        shell: pwsh
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v0.2-apk
          path: veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
