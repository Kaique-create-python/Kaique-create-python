name: Build VEILBREAKERS APK

on:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

concurrency:
  group: veilbreakers-apk-v04
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        shell: pwsh
        run: |
          $sdk = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdk) {
            & $sdk "platforms;android-35" "build-tools;35.0.0"
          }
      - name: Decode clean animation frames
        shell: pwsh
        run: |
          $dest = "veilbreakers-prototype/app/src/main/assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $parts = Get-ChildItem "veilbreakers-prototype/app/src/main/assets_b64/kael_frames_v03.zip.b64.part-*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\kael_frames_v03.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Force "$env:RUNNER_TEMP\kael_frames_v03.zip" $dest
          if (!(Test-Path "$dest/kael/move/move_r0_f0.png")) { throw "Movement frames missing" }
          if (!(Test-Path "$dest/kael/attack/attack_right_5.png")) { throw "Attack frames missing" }
          if (!(Test-Path "$dest/menu/menu_bg.jpg")) { throw "Menu background missing" }
          if (!(Test-Path "$dest/menu/menu_logo.png")) { throw "Menu logo missing" }
      - name: Build debug APK
        working-directory: veilbreakers-prototype
        shell: pwsh
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v0.4-apk
          path: veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
