name: Build VEILBREAKERS APK

on:
  push:
    branches: [ veilbreakers-apk-build ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'veilbreakers-prototype/**'
      - '.github/workflows/build-veilbreakers.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager | head -n 1)"
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode sprite assets
        shell: bash
        run: |
          mkdir -p veilbreakers-prototype/app/src/main/assets
          cat veilbreakers-prototype/app/src/main/assets_b64/move_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/move_sheet.png
          cat veilbreakers-prototype/app/src/main/assets_b64/attack_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/attack_sheet.png
          cat veilbreakers-prototype/app/src/main/assets_b64/magic_sheet.png.b64.part-* | base64 -d > veilbreakers-prototype/app/src/main/assets/magic_sheet.png
      - name: Build debug APK
        working-directory: veilbreakers-prototype
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veilbreakers-v0.1-apk
          path: veilbreakers-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
