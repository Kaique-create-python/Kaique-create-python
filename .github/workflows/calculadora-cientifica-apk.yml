name: Calculadora científica - APK Android
on:
  push:
    branches:
      - build-calculadora-cientifica
    paths:
      - 'calc-build/**'
      - '.github/workflows/calculadora-cientifica-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Usar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruir projeto Android a partir do ZIP
        shell: bash
        run: |
          base64 -d calc-build/source-v1.1.zip.b64 > /tmp/calculadora-source.zip
          mkdir -p calculadora_build
          unzip -q /tmp/calculadora-source.zip -d calculadora_build
          test -f calculadora_build/settings.gradle
      - name: Baixar SDK Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de debug
        run: gradle -p calculadora_build --no-daemon assembleDebug
      - name: Validar APK
        run: |
          test -s calculadora_build/app/build/outputs/apk/debug/app-debug.apk
          ls -lh calculadora_build/app/build/outputs/apk/debug/app-debug.apk
      - name: Anexar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-cientifica-v1.1-APK
          path: calculadora_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
