name: Build Diana PC Public APK

on:
  push:
    branches:
      - diana-pc-public
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Fetch Winlator 11.2 source
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git upstream

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply Diana PC v0.2 patches
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream

          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Patch target not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # Identity/version.
          must_replace("app/build.gradle", "applicationId 'com.winlator'", "applicationId 'com.dianapc'")
          must_replace("app/build.gradle", "versionCode 33", "versionCode 2")
          must_replace("app/build.gradle", 'versionName "11.2"', 'versionName "0.2.0"')
          must_replace(
              "app/src/main/AndroidManifest.xml",
              'android:authorities="com.winlator.FileProvider"',
              'android:authorities="com.dianapc.FileProvider"'
          )

          # Package rename leftovers that are runtime paths/authorities (not Java package names).
          must_replace(
              "app/src/main/java/com/winlator/core/FileUtils.java",
              '"com.winlator.FileProvider"',
              '"com.dianapc.FileProvider"'
          )
          for p in Path("app/src/main").rglob("*"):
              if p.is_file():
                  try:
                      s = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  if "/data/data/com.winlator" in s:
                      p.write_text(s.replace("/data/data/com.winlator", "/data/data/com.dianapc"))

          # E: = phone shared storage; D: already maps to Downloads.
          must_replace(
              "app/src/main/java/com/winlator/core/AppUtils.java",
              'public static final String INTERNAL_STORAGE = "/data/data/com.dianapc/storage";',
              'public static final String INTERNAL_STORAGE = Environment.getExternalStorageDirectory().getPath();'
          )

          # Branding.
          for p in Path("app/src/main/res").glob("values*/strings.xml"):
              s = p.read_text()
              s = s.replace('>Winlator<', '>Diana PC<')
              s = s.replace(' Winlator ', ' Diana PC ')
              s = s.replace(' Winlator<', ' Diana PC<')
              s = s.replace('>Winlator ', '>Diana PC ')
              p.write_text(s)

          # Browser entry. Wine's browser registry bridge is already enabled by default upstream.
          must_replace(
              "app/src/main/assets/wine_startmenu.json",
              '"name" : "Internet Explorer"',
              '"name" : "Chrome / Internet"'
          )

          # Use upstream Virtual Gamepad (profile 3) as fallback for launched shortcuts.
          must_replace(
              "app/src/main/java/com/winlator/XServerDisplayActivity.java",
              'String controlsProfile = shortcut.getExtra("controlsProfile");',
              'String controlsProfile = shortcut.getExtra("controlsProfile", "3");'
          )

          # Add in-session PC settings menu entry.
          menu = Path("app/src/main/res/menu/xserver_menu.xml")
          ms = menu.read_text()
          marker = '        <item android:icon="@drawable/icon_help" android:id="@+id/menu_item_touchpad_help" android:title="@string/touchpad_help" />\n'
          if marker not in ms:
              raise SystemExit("xserver menu marker not found")
          ms = ms.replace(
              marker,
              marker + '        <item android:icon="@drawable/icon_settings" android:id="@+id/menu_item_diana_settings" android:title="@string/diana_pc_settings" />\n',
              1
          )
          menu.write_text(ms)

          for rel, value in [
              ("app/src/main/res/values/strings.xml", "PC Settings"),
              ("app/src/main/res/values-pt/strings.xml", "Configurações do PC"),
          ]:
              p = Path(rel)
              ss = p.read_text()
              if 'name="diana_pc_settings"' not in ss:
                  ss = ss.replace("</resources>", f'    <string name="diana_pc_settings">{value}</string>\n</resources>')
                  p.write_text(ss)

          # Add the settings action before Exit.
          xserver = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()
          match = re.search(r'(?m)^(\\s*)case R\\.id\\.menu_item_exit:\\s*$', xs)
          if not match:
              raise SystemExit("XServer exit menu marker not found")
          indent = match.group(1)
          settings_case = (
              indent + 'case R.id.menu_item_diana_settings:\\n' +
              indent + '    Intent dianaSettingsIntent = new Intent(this, MainActivity.class);\\n' +
              indent + '    dianaSettingsIntent.putExtra("diana_skip_autoboot", true);\\n' +
              indent + '    dianaSettingsIntent.putExtra("edit_container_id", container.id);\\n' +
              indent + '    startActivity(dianaSettingsIntent);\\n' +
              indent + '    drawerLayout.closeDrawers();\\n' +
              indent + '    break;\\n'
          )
          xs = xs[:match.start()] + settings_case + xs[match.start():]
          xserver.write_text(xs)

          # MainActivity imports.
          main = Path("app/src/main/java/com/winlator/MainActivity.java")
          s = main.read_text()
          s = s.replace(
              "import com.winlator.contentdialog.AboutDialog;\n",
              "import com.winlator.contentdialog.AboutDialog;\n"
              "import com.winlator.box64.Box64Preset;\n"
              "import com.winlator.container.Container;\n"
              "import com.winlator.container.ContainerManager;\n",
              1
          )
          s = s.replace(
              "import com.winlator.xenvironment.RootFSInstaller;\n",
              "import com.winlator.xenvironment.RootFS;\n"
              "import com.winlator.xenvironment.RootFSInstaller;\n\n"
              "import org.json.JSONException;\n"
              "import org.json.JSONObject;\n",
              1
          )

          s = s.replace(
              "    private Fragment currentFragment;\n",
              "    private Fragment currentFragment;\n    private boolean dianaAutoBootStarted = false;\n",
              1
          )

          # On normal launch: install/update RootFS, then auto boot. If opened from PC Settings, stay in settings.
          startup_line = "            if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);"
          if startup_line not in s:
              raise SystemExit("MainActivity startup line not found")
          startup_block = '''            int editContainerId = intent.getIntExtra("edit_container_id", 0);
              boolean skipAutoBoot = intent.getBooleanExtra("diana_skip_autoboot", false);
              if (!requestAppPermissions()) {
                  RootFSInstaller.installIfNeeded(this);
                  if (editContainerId > 0) showFragment(new ContainerDetailFragment(editContainerId));
                  else if (!skipAutoBoot) startDianaPcWhenReady();
              }'''
          s = s.replace(startup_line, startup_block, 1)

          # Permission callback: same flow after permission approval.
          permission_old = '''                RootFSInstaller.installIfNeeded(this);'''
          permission_new = '''                RootFSInstaller.installIfNeeded(this);
                  Intent intent = getIntent();
                  int editContainerId = intent.getIntExtra("edit_container_id", 0);
                  boolean skipAutoBoot = intent.getBooleanExtra("diana_skip_autoboot", false);
                  if (editContainerId > 0) showFragment(new ContainerDetailFragment(editContainerId));
                  else if (!skipAutoBoot) startDianaPcWhenReady();'''
          # Replace the next remaining occurrence (the one in onRequestPermissionsResult).
          if permission_old not in s:
              raise SystemExit("MainActivity permission install line not found")
          s = s.replace(permission_old, permission_new, 1)

          # Insert auto-container/boot helpers immediately before requestAppPermissions().
          helper_marker = "    private boolean requestAppPermissions() {"
          if helper_marker not in s:
              raise SystemExit("MainActivity helper marker not found")
          helpers = '''    private void startDianaPcWhenReady() {
              if (dianaAutoBootStarted) return;
              dianaAutoBootStarted = true;

              final android.os.Handler handler = new android.os.Handler(getMainLooper());
              handler.post(new Runnable() {
                  @Override
                  public void run() {
                      if (isFinishing() || (android.os.Build.VERSION.SDK_INT >= 17 && isDestroyed())) return;

                      RootFS rootFS = RootFS.find(MainActivity.this);
                      if (!rootFS.isValid() || rootFS.getVersion() < RootFSInstaller.LATEST_VERSION) {
                          handler.postDelayed(this, 1000);
                          return;
                      }

                      ContainerManager manager = new ContainerManager(MainActivity.this);
                      if (!manager.getContainers().isEmpty()) {
                          launchDianaContainer(manager.getContainers().get(0));
                          return;
                      }

                      try {
                          JSONObject data = new JSONObject();
                          data.put("name", "Diana PC");
                          data.put("screenSize", Container.DEFAULT_SCREEN_SIZE);
                          data.put("envVars", Container.DEFAULT_ENV_VARS);
                          data.put("wincomponents", Container.DEFAULT_WINCOMPONENTS);
                          data.put("drives", Container.DEFAULT_DRIVES);
                          data.put("box64Preset", Box64Preset.PERFORMANCE);

                          preloaderDialog.show(R.string.creating_container);
                          manager.createContainerAsync(data, (container) -> {
                              preloaderDialog.closeOnUiThread();
                              if (container != null) launchDianaContainer(container);
                              else dianaAutoBootStarted = false;
                          });
                      }
                      catch (JSONException e) {
                          dianaAutoBootStarted = false;
                      }
                  }
              });
          }

          private void launchDianaContainer(Container container) {
              Intent intent = new Intent(this, XServerDisplayActivity.class);
              intent.putExtra("container_id", container.id);
              startActivity(intent);
          }

          '''
          s = s.replace(helper_marker, helpers + helper_marker, 1)
          main.write_text(s)
          PY

          cat > DIANA-PC-NOTES.md <<'EOF'
          # Diana PC v0.2

          Based on Winlator 11.2.

          - Creates a Diana PC container automatically on first launch.
          - Boots directly into the Wine desktop after system installation.
          - D: = Android Downloads.
          - E: = Android shared internal storage.
          - Fixes runtime paths/authorities after package rename.
          - "Chrome / Internet" uses Winlator's Android browser bridge; downloads land in D:.
          - Adds "PC Settings" inside the running session for wallpaper/theme/container settings.
          - Uses upstream Virtual Gamepad as the fallback control profile for launched shortcuts.
          - Retains upstream Wine, Box64, Mesa, DXVK, VKD3D, input controls and licensing/credits.
          EOF

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp upstream/app/build/outputs/apk/debug/app-debug.apk Diana-PC-v0.2.apk
          sha256sum Diana-PC-v0.2.apk | tee Diana-PC-v0.2.sha256
          ls -lh Diana-PC-v0.2.apk

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete diana-pc-v0.2 --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create diana-pc-v0.2             Diana-PC-v0.2.apk             Diana-PC-v0.2.sha256             --repo "$GITHUB_REPOSITORY"             --target diana-pc-public             --title "Diana PC v0.2"             --notes "Diana PC v0.2: boot automático, container pronto, D: Downloads, E: armazenamento do celular, navegador integrado, configurações do PC e Virtual Gamepad padrão. Base Winlator 11.2 com licenças/créditos preservados."
