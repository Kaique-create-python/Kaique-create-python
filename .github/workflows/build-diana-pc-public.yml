          # Diana PC v0.6

          Based on Winlator 11.2.

          - Creates a Diana PC container automatically on first launch.
          - Boots directly into the Wine desktop after system installation.
          - Keeps Winlator's original com.winlator runtime identity so native/rootfs paths stay valid.
          - Detects non-Adreno GPUs and performs a one-time Mali-safe migration.
          - Mali-safe mode uses VirGL + WineD3D + Box64 Stability.
          - Prevents Vortek from starting beside VirGL during the safe boot path.
          - D: = Android Downloads.
          - E: = Android shared internal storage.
          - Fixes runtime paths/authorities after package rename.
          - "Chrome / Internet" uses Winlator's Android browser bridge; downloads land in D:.
          - Adds "PC Settings" inside the running session for wallpaper/theme/container settings.
          - Desktop now starts with Computer, Downloads, Chrome, Internet, Control Panel, Notepad, Terminal and Steam installer icons.
          - Installed Android games appear as desktop shortcuts and launch natively outside Wine.
          - Full-size non-system Windows app windows automatically receive the upstream Virtual Gamepad profile.
          - Text-oriented Wine apps use a best-effort tap-to-open Android keyboard mode.
          - EXE/MSI/BAT/CMD files downloaded to D: automatically receive desktop shortcuts.
          - Newly installed Start Menu apps are mirrored to the desktop automatically while Diana PC is open.
          - Uses upstream Virtual Gamepad as the fallback control profile for launched shortcuts.
          - Retains upstream Wine, Box64, Mesa, DXVK, VKD3D, input controls and licensing/credits.
