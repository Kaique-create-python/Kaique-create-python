name: Build Diana PC Public APK

on:
  push:
    branches:
      - diana-pc-public
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Diana patches
        uses: actions/checkout@v4

      - name: Fetch Winlator 11.2 source
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git upstream

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply Diana PC v0.8 Astra Control patches
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream

          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Patch target not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # Identity/version.
          must_replace("app/build.gradle", "versionCode 33", "versionCode 8")
          must_replace("app/build.gradle", 'versionName "11.2"', 'versionName "0.3.0"')
          # Package rename leftovers that are runtime paths/authorities (not Java package names).
          # E: = phone shared storage; D: already maps to Downloads.
          must_replace(
              "app/src/main/java/com/winlator/core/AppUtils.java",
              'public static final String INTERNAL_STORAGE = "/data/data/com.winlator/storage";',
              'public static final String INTERNAL_STORAGE = Environment.getExternalStorageDirectory().getPath();'
          )

          # Astra computer-use controller source.
          astra_src = Path("../diana/v08/AstraController.java")
          astra_dst = Path("app/src/main/java/com/winlator/core/AstraController.java")
          if not astra_src.is_file():
              raise SystemExit("AstraController.java not found in Diana repo")
          astra_dst.write_text(astra_src.read_text())

          # Branding.
          for p in Path("app/src/main/res").glob("values*/strings.xml"):
              s = p.read_text()
              s = s.replace('>Winlator<', '>Diana PC<')
              s = s.replace(' Winlator ', ' Diana PC ')
              s = s.replace(' Winlator<', ' Diana PC<')
              s = s.replace('>Winlator ', '>Diana PC ')
              p.write_text(s)

          # Native Chrome + explicit soft keyboard bridge.
          file_utils = Path("app/src/main/java/com/winlator/core/FileUtils.java")
          fus = file_utils.read_text()
          open_anchor = "    public static void openIntent(Activity activity, String path) {\n"
          if open_anchor not in fus:
              raise SystemExit("FileUtils openIntent signature not found")
          bridge_code = '''        if (path.equals("diana-browser://chrome")) {
              Intent chromeIntent = activity.getPackageManager().getLaunchIntentForPackage("com.android.chrome");
              if (chromeIntent != null) {
                  chromeIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  activity.startActivity(chromeIntent);
              }
              else {
                  Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"));
                  browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  activity.startActivity(browserIntent);
              }
              return;
          }

          if (path.equals("diana-keyboard://show")) {
              final android.view.inputmethod.InputMethodManager imm =
                  (android.view.inputmethod.InputMethodManager)activity.getSystemService(android.content.Context.INPUT_METHOD_SERVICE);
              activity.getWindow().getDecorView().postDelayed(
                  () -> imm.toggleSoftInput(android.view.inputmethod.InputMethodManager.SHOW_FORCED, 0),
                  100L
              );
              return;
          }

          '''
          file_utils.write_text(fus.replace(open_anchor, open_anchor + bridge_code, 1))

          # Browser entry. Wine's browser registry bridge is already enabled by default upstream.
          must_replace(
              "app/src/main/assets/wine_startmenu.json",
              '"name" : "Internet Explorer"',
              '"name" : "Chrome / Internet"'
          )

          # Use upstream Virtual Gamepad (profile 3) as fallback for launched shortcuts.
          must_replace(
              "app/src/main/java/com/winlator/XServerDisplayActivity.java",
              'String controlsProfile = shortcut.getExtra("controlsProfile");',
              'String controlsProfile = shortcut.getExtra("controlsProfile", "3");'
          )

          # On the POCO C65 / Mali path, VirGL should run without starting Vortek beside it.
          # This avoids the renderer deadlock seen before the first Wine desktop window appears.
          must_replace(
              "app/src/main/java/com/winlator/XServerDisplayActivity.java",
              'if (graphicsDriver[0].equals(GraphicsDrivers.VORTEK)) {',
              'if (graphicsDriver[0].equals(GraphicsDrivers.VORTEK) && !graphicsDriver[1].equals(GraphicsDrivers.VIRGL)) {'
          )

          # Add in-session PC settings menu entry.
          menu = Path("app/src/main/res/menu/xserver_menu.xml")
          ms = menu.read_text()
          if 'menu_item_astra_control' not in ms:
              settings_item = '        <item android:icon="@drawable/icon_settings" android:id="@+id/menu_item_diana_settings" android:title="@string/diana_pc_settings" />\n'
              astra_item = '        <item android:icon="@drawable/icon_play" android:id="@+id/menu_item_astra_control" android:title="@string/astra_control" />\n'
              if settings_item in ms:
                  ms = ms.replace(settings_item, settings_item + astra_item, 1)
          marker = '        <item android:icon="@drawable/icon_help" android:id="@+id/menu_item_touchpad_help" android:title="@string/touchpad_help" />\n'
          if marker not in ms:
              raise SystemExit("xserver menu marker not found")
          ms = ms.replace(
              marker,
              marker + '        <item android:icon="@drawable/icon_settings" android:id="@+id/menu_item_diana_settings" android:title="@string/diana_pc_settings" />\n',
              1
          )
          menu.write_text(ms)

          for rel, value in [
              ("app/src/main/res/values/strings.xml", "PC Settings"),
              ("app/src/main/res/values-pt/strings.xml", "Configurações do PC"),
          ]:
              p = Path(rel)
              ss = p.read_text()
              if 'name="diana_pc_settings"' not in ss:
                  ss = ss.replace("</resources>", f'    <string name="diana_pc_settings">{value}</string>\n</resources>')
              if 'name="astra_control"' not in ss:
                  astra_value = "Astra Control"
                  ss = ss.replace("</resources>", f'    <string name="astra_control">{astra_value}</string>\n</resources>')
              p.write_text(ss)

          # Add the settings action before Exit.
          xserver = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()
          needle = "case R.id.menu_item_exit:"
          idx = xs.find(needle)
          if idx < 0:
              raise SystemExit("XServer exit menu marker not found")
          NL = chr(10)
          line_start = xs.rfind(NL, 0, idx) + 1
          indent = xs[line_start:idx]
          settings_case = NL.join([
              indent + "case R.id.menu_item_diana_settings:",
              indent + "    Intent dianaSettingsIntent = new Intent(this, MainActivity.class);",
              indent + '    dianaSettingsIntent.putExtra("diana_skip_autoboot", true);',
              indent + '    dianaSettingsIntent.putExtra("edit_container_id", container.id);',
              indent + "    startActivity(dianaSettingsIntent);",
              indent + "    drawerLayout.closeDrawers();",
              indent + "    break;",
          ]) + NL
          xs = xs[:line_start] + settings_case + xs[line_start:]
          xserver.write_text(xs)

          # Astra Control UI inside the running Diana PC session.
          xserver = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()

          import_anchor = "import com.winlator.core.AppUtils;\n"
          if import_anchor not in xs:
              raise SystemExit("Astra import anchor not found")
          if "import com.winlator.core.AstraController;" not in xs:
              xs = xs.replace(import_anchor, import_anchor + "import com.winlator.core.AstraController;\n", 1)

          android_import_anchor = "import android.widget.ArrayAdapter;\n"
          extra_android_imports = (
              "import android.text.InputType;\n"
              "import android.widget.Button;\n"
              "import android.widget.EditText;\n"
              "import android.widget.LinearLayout;\n"
              "import android.widget.TextView;\n"
              "import android.widget.Toast;\n"
          )
          if android_import_anchor not in xs:
              raise SystemExit("Astra Android import anchor not found")
          if "import android.widget.EditText;" not in xs:
              xs = xs.replace(android_import_anchor, android_import_anchor + extra_android_imports, 1)

          field_anchor = "    private Shortcut shortcut;\n"
          if field_anchor not in xs:
              raise SystemExit("Astra field anchor not found")
          if "private AstraController astraController;" not in xs:
              xs = xs.replace(field_anchor, field_anchor + "    private AstraController astraController;\n", 1)

          exit_case = "            case R.id.menu_item_exit:\n"
          if exit_case not in xs:
              raise SystemExit("Astra menu case anchor not found")
          if "case R.id.menu_item_astra_control:" not in xs:
              astra_case = (
                  "            case R.id.menu_item_astra_control:\n"
                  "                showAstraControlDialog();\n"
                  "                drawerLayout.closeDrawers();\n"
                  "                break;\n"
              )
              xs = xs.replace(exit_case, astra_case + exit_case, 1)

          helper_anchor = "    private void showInputControlsDialog() {"
          if helper_anchor not in xs:
              raise SystemExit("Astra helper anchor not found")
          if "private void showAstraControlDialog()" not in xs:
              astra_methods = r'''    private void showAstraControlDialog() {
              final android.content.SharedPreferences astraPrefs =
                  getSharedPreferences("diana_astra", MODE_PRIVATE);

              final LinearLayout layout = new LinearLayout(this);
              layout.setOrientation(LinearLayout.VERTICAL);
              int pad = (int)(20 * getResources().getDisplayMetrics().density);
              layout.setPadding(pad, pad, pad, pad);

              final EditText apiKey = new EditText(this);
              apiKey.setHint("OpenAI API key");
              apiKey.setSingleLine(true);
              apiKey.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
              apiKey.setText(astraPrefs.getString("api_key", ""));
              layout.addView(apiKey);

              final EditText task = new EditText(this);
              task.setHint("Ex.: abra Downloads e instale o programa que baixei");
              task.setMinLines(3);
              task.setMaxLines(6);
              task.setGravity(android.view.Gravity.TOP);
              layout.addView(task);

              final TextView info = new TextView(this);
              info.setText("Astra controla somente o desktop emulado. A chave fica salva apenas no armazenamento privado deste app.");
              info.setPadding(0, pad / 2, 0, pad / 2);
              layout.addView(info);

              final TextView status = new TextView(this);
              status.setText(astraController != null && astraController.isRunning() ? "Astra executando..." : "Astra parado");
              layout.addView(status);

              final LinearLayout buttons = new LinearLayout(this);
              buttons.setOrientation(LinearLayout.HORIZONTAL);

              final Button start = new Button(this);
              start.setText("Controlar PC");
              buttons.addView(start, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

              final Button stop = new Button(this);
              stop.setText("PARAR");
              buttons.addView(stop, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

              layout.addView(buttons);

              final androidx.appcompat.app.AlertDialog dialog =
                  new androidx.appcompat.app.AlertDialog.Builder(this)
                      .setTitle("Astra Control")
                      .setView(layout)
                      .setNegativeButton("Fechar", null)
                      .create();

              AstraController.Listener listener = new AstraController.Listener() {
                  @Override
                  public void onStatus(String message) {
                      status.setText(message);
                  }

                  @Override
                  public void onFinished(String message) {
                      status.setText(message);
                      Toast.makeText(XServerDisplayActivity.this, message, Toast.LENGTH_LONG).show();
                  }

                  @Override
                  public void onError(String message) {
                      status.setText(message);
                      Toast.makeText(XServerDisplayActivity.this, message, Toast.LENGTH_LONG).show();
                  }
              };

              start.setOnClickListener(v -> {
                  String key = apiKey.getText().toString().trim();
                  String command = task.getText().toString().trim();

                  if (key.isEmpty() || command.isEmpty()) {
                      Toast.makeText(this, "Digite a chave da API e o comando.", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  astraPrefs.edit().putString("api_key", key).apply();

                  if (astraController != null) astraController.stop();
                  astraController = new AstraController(this, xServer, xServerView, listener);
                  astraController.start(key, command);
                  status.setText("Astra iniciando...");
              });

              stop.setOnClickListener(v -> {
                  if (astraController != null) astraController.stop();
                  status.setText("Astra parado");
              });

              dialog.show();
          }

          '''
              xs = xs.replace(helper_anchor, astra_methods + helper_anchor, 1)

          destroy_anchor = "    protected void onDestroy() {\n"
          if destroy_anchor not in xs:
              raise SystemExit("Astra onDestroy anchor not found")
          if "if (astraController != null) astraController.stop();" not in xs:
              xs = xs.replace(
                  destroy_anchor,
                  destroy_anchor + "        if (astraController != null) astraController.stop();\n",
                  1
              )

          xserver.write_text(xs)

          # Diana PC desktop integration: system icons + automatic downloaded/installed app shortcuts.
          desktop_manager = Path("app/src/main/java/com/winlator/core/DianaDesktopManager.java")
          desktop_manager.write_text(r'''          package com.winlator.core;
          
          import android.os.FileObserver;
          
          import com.winlator.container.Container;
          import com.winlator.win32.MSLink;
          
          import java.io.File;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.Timer;
          import java.util.TimerTask;
          
          public abstract class DianaDesktopManager {
              private static FileObserver downloadsObserver;
              private static Timer installedAppsTimer;
              private static final Set<String> BUILTIN_START_MENU = new HashSet<>();
          
              static {
                  String[] names = new String[]{
                      "7-Zip", "Chrome / Internet", "Internet Explorer", "Notepad", "Wordpad", "WineMine",
                      "GPUInfo", "Test Direct3D", "Computer", "Task Manager", "Registry Editor",
                      "Command Prompt", "Wine Configuration", "Wine Mono (.NET Framework)",
                      "Wine Gecko (For HTML Pages)", "Steam (Legacy)"
                  };
                  for (String name : names) BUILTIN_START_MENU.add(name.toLowerCase(Locale.ENGLISH));
              }
          
              public static synchronized void start(android.content.Context context, Container container) {
                  stop();
          
                  File desktopDir = getDesktopDir(container);
                  createDefaultIcons(desktopDir);
                  syncDownloads(container, desktopDir);
                  syncInstalledApps(container, desktopDir);
          
                  final File downloadsDir = new File(AppUtils.DIRECTORY_DOWNLOADS);
                  if (!downloadsDir.isDirectory()) downloadsDir.mkdirs();
          
                  downloadsObserver = new FileObserver(
                      downloadsDir.getAbsolutePath(),
                      FileObserver.CREATE | FileObserver.CLOSE_WRITE | FileObserver.MOVED_TO
                  ) {
                      @Override
                      public void onEvent(int event, String path) {
                          if (path == null) return;
                          syncDownloadedProgram(container, new File(downloadsDir, path));
                      }
                  };
                  downloadsObserver.startWatching();
          
                  // Program installation is infrequent; scan only every 60s to avoid desktop stutter.
                  installedAppsTimer = new Timer("DianaInstalledAppsSync", true);
                  installedAppsTimer.scheduleAtFixedRate(new TimerTask() {
                      @Override
                      public void run() {
                          syncInstalledApps(container, getDesktopDir(container));
                      }
                  }, 60000, 60000);
              }
          
              public static synchronized void stop() {
                  if (downloadsObserver != null) {
                      downloadsObserver.stopWatching();
                      downloadsObserver = null;
                  }
                  if (installedAppsTimer != null) {
                      installedAppsTimer.cancel();
                      installedAppsTimer = null;
                  }
              }
          
              private static File getDesktopDir(Container container) {
                  File desktopDir = new File(container.getUserDir(), "Desktop");
                  if (!desktopDir.isDirectory()) desktopDir.mkdirs();
                  return desktopDir;
              }
          
              private static void createDefaultIcons(File desktopDir) {
                  createLink(desktopDir, "Computador", "C:\\windows\\wfm.exe", null, "C:\\windows\\wfm.exe", false);
                  createLink(desktopDir, "Downloads", "D:\\", null, "C:\\windows\\explorer.exe", true);
                  createLink(desktopDir, "Chrome", "C:\\windows\\system32\\iexplore.exe", "diana-browser://chrome", "C:\\windows\\system32\\iexplore.exe", false);
                  createLink(desktopDir, "ChatGPT", "C:\\windows\\system32\\iexplore.exe", "https://chatgpt.com", "C:\\windows\\system32\\iexplore.exe", false);
                  createLink(desktopDir, "Teclado", "C:\\windows\\system32\\iexplore.exe", "diana-keyboard://show", "C:\\windows\\system32\\osk.exe", false);
                  createLink(desktopDir, "Painel de Controle", "C:\\windows\\system32\\control.exe", null, "C:\\windows\\system32\\control.exe", false);
                  createLink(desktopDir, "Bloco de Notas", "C:\\windows\\notepad.exe", null, "C:\\windows\\notepad.exe", false);
                  createLink(desktopDir, "Terminal", "C:\\windows\\system32\\cmd.exe", null, "C:\\windows\\system32\\cmd.exe", false);
                  createLink(
                      desktopDir,
                      "Instalar Steam",
                      "Z:\\opt\\apps\\winaddons.exe",
                      "-n \"Steam (Legacy)\" -d \"Steam\" -e \"steam.exe\"",
                      "Z:\\opt\\apps\\winaddons.exe",
                      false
                  );
              }
          
              private static void syncDownloads(Container container, File desktopDir) {
                  File downloadsDir = new File(AppUtils.DIRECTORY_DOWNLOADS);
                  File[] files = downloadsDir.listFiles();
                  if (files == null) return;
                  for (File file : files) syncDownloadedProgram(container, file, desktopDir);
              }
          
              private static void syncDownloadedProgram(Container container, File file) {
                  syncDownloadedProgram(container, file, getDesktopDir(container));
              }
          
              private static void syncDownloadedProgram(Container container, File file, File desktopDir) {
                  if (file == null || !file.isFile()) return;
                  String lower = file.getName().toLowerCase(Locale.ENGLISH);
                  if (!(lower.endsWith(".exe") || lower.endsWith(".msi") || lower.endsWith(".bat") || lower.endsWith(".cmd"))) return;
          
                  String name = StringUtils.clearReservedChars(FileUtils.getBasename(file.getName()));
                  String dosPath = WineUtils.unixToDOSPath(file.getAbsolutePath(), container);
                  if (dosPath == null || dosPath.isEmpty()) return;
          
                  if (lower.endsWith(".msi")) {
                      createLink(
                          desktopDir,
                          name,
                          "C:\\windows\\system32\\msiexec.exe",
                          "/i \"" + dosPath + "\"",
                          "C:\\windows\\system32\\msiexec.exe",
                          false
                      );
                  }
                  else createLink(desktopDir, name, dosPath, null, dosPath, false);
              }
          
              private static void syncInstalledApps(Container container, File desktopDir) {
                  syncInstalledAppsRecursive(container.getStartMenuDir(), desktopDir);
              }
          
              private static void syncInstalledAppsRecursive(File dir, File desktopDir) {
                  File[] files = dir.listFiles();
                  if (files == null) return;
          
                  for (File file : files) {
                      if (file.isDirectory()) syncInstalledAppsRecursive(file, desktopDir);
                      else if (file.getName().toLowerCase(Locale.ENGLISH).endsWith(".lnk")) {
                          String name = FileUtils.getBasename(file.getName());
                          if (BUILTIN_START_MENU.contains(name.toLowerCase(Locale.ENGLISH))) continue;
                          File output = new File(desktopDir, StringUtils.clearReservedChars(name) + ".lnk");
                          if (!output.isFile()) FileUtils.copy(file, output);
                      }
                  }
              }
          
              private static void createLink(
                  File desktopDir,
                  String name,
                  String targetPath,
                  String arguments,
                  String iconLocation,
                  boolean directory
              ) {
                  File output = new File(desktopDir, StringUtils.clearReservedChars(name) + ".lnk");
                  if (output.isFile()) return;
          
                  MSLink.LinkInfo info = new MSLink.LinkInfo();
                  info.targetPath = targetPath;
                  info.arguments = arguments;
                  info.iconLocation = iconLocation;
                  info.isDirectory = directory;
                  MSLink.createFile(info, output);
              }
          }
          
          ''')

          # Wire desktop manager into the active Wine session.
          xserver = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()
          import_anchor = "import com.winlator.core.AppUtils;\n"
          if import_anchor not in xs:
              raise SystemExit("DianaDesktopManager import anchor not found")
          xs = xs.replace(
              import_anchor,
              import_anchor + "import com.winlator.core.DianaDesktopManager;\n",
              1
          )

          setup_anchor = "            containerManager.activateContainer(container);\n"
          if setup_anchor not in xs:
              raise SystemExit("DianaDesktopManager setup anchor not found")
          xs = xs.replace(
              setup_anchor,
              setup_anchor + "            DianaDesktopManager.start(this, container);\n",
              1
          )

          destroy_anchor = "    protected void onDestroy() {\n        winHandler.stop();\n"
          if destroy_anchor not in xs:
              raise SystemExit("DianaDesktopManager destroy anchor not found")
          xs = xs.replace(
              destroy_anchor,
              "    protected void onDestroy() {\n        DianaDesktopManager.stop();\n        winHandler.stop();\n",
              1
          )
          xserver.write_text(xs)

          # Auto game controls + best-effort Android keyboard integration.
          xserver = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()

          pointer_import = "import com.winlator.xserver.Property;\n"
          if pointer_import not in xs:
              raise SystemExit("Pointer import anchor not found")
          xs = xs.replace(
              pointer_import,
              pointer_import + "import com.winlator.xserver.Pointer;\n",
              1
          )

          field_anchor = "    private Shortcut shortcut;\n"
          if field_anchor not in xs:
              raise SystemExit("Diana interaction fields anchor not found")
          xs = xs.replace(
              field_anchor,
              field_anchor +
              "    private boolean dianaAutoGamepadVisible = false;\n" +
              "    private long dianaLastKeyboardRequest = 0;\n",
              1
          )

          map_anchor = "                if (win32AppWorkarounds != null) win32AppWorkarounds.applyWindowWorkarounds(window);\n"
          if map_anchor not in xs:
              raise SystemExit("onMapWindow anchor not found")
          xs = xs.replace(
              map_anchor,
              "                maybeShowDianaGameControls(window);\n" + map_anchor,
              1
          )

          helper_anchor = "    private void showInputControlsDialog() {"
          if helper_anchor not in xs:
              raise SystemExit("input helper anchor not found")
          helpers = '''    private void maybeShowDianaGameControls(Window window) {
              if (dianaAutoGamepadVisible || window == null || !window.isRenderable() || !window.attributes.isViewable()) return;

              String cls = window.getClassName().toLowerCase(java.util.Locale.ENGLISH);
              if (cls.isEmpty() || isDianaSystemApp(cls)) return;

              int minWidth = (int)(screenInfo.width * 0.62f);
              int minHeight = (int)(screenInfo.height * 0.55f);
              if (window.getWidth() < minWidth || window.getHeight() < minHeight) return;

              ControlsProfile profile = inputControlsManager != null ? inputControlsManager.getProfile(3) : null;
              if (profile == null) return;

              dianaAutoGamepadVisible = true;
              runOnUiThread(() -> {
                  if (inputControlsView != null) showInputControls(profile);
              });
          }

          private boolean isDianaSystemApp(String cls) {
              String[] systemApps = new String[]{
                  "explorer.exe", "wfm.exe", "iexplore.exe", "notepad.exe", "write.exe",
                  "control.exe", "cmd.exe", "taskmgr.exe", "regedit.exe", "winecfg.exe",
                  "msiexec.exe", "rundll32.exe", "services.exe", "wineboot.exe",
                  "steam.exe", "steamwebhelper.exe", "winaddons.exe", "unins000.exe"
              };
              for (String name : systemApps) if (cls.contains(name)) return true;

              return cls.contains("setup") || cls.contains("install") || cls.contains("uninstall");
          }

          '''
          xs = xs.replace(helper_anchor, helpers + helper_anchor, 1)
          xserver.write_text(xs)

          # One-finger hold-and-drag: hold ~220 ms, then move to drag windows/maps/items.
          touchpad = Path("app/src/main/java/com/winlator/widget/TouchpadView.java")
          ts = touchpad.read_text()
          drag_anchor = "        boolean skipPointerMove = false;\n"
          drag_code = '''        boolean skipPointerMove = false;

              if (numFingers == 1 &&
                  !scrolling &&
                  !xServer.pointer.isButtonPressed(Pointer.Button.BUTTON_LEFT) &&
                  (System.currentTimeMillis() - finger1.touchTime) >= 220) {
                  pressPointerButtonLeft(finger1);
              }
          '''
          if drag_anchor not in ts:
              raise SystemExit("Touchpad drag line not found")
          touchpad.write_text(ts.replace(drag_anchor, drag_code, 1))

          # MainActivity imports.
          main = Path("app/src/main/java/com/winlator/MainActivity.java")
          s = main.read_text()
          s = s.replace(
              "import com.winlator.contentdialog.AboutDialog;\n",
              "import com.winlator.contentdialog.AboutDialog;\n"
              "import com.winlator.box64.Box64Preset;\n"
              "import com.winlator.container.Container;\n"
              "import com.winlator.container.ContainerManager;\n"
              "import com.winlator.container.GraphicsDrivers;\n"
              "import com.winlator.container.DXWrappers;\n"
              "import com.winlator.core.EnvVars;\n"
              "import com.winlator.core.GPUHelper;\n",
              1
          )
          s = s.replace(
              "import com.winlator.xenvironment.RootFSInstaller;\n",
              "import com.winlator.xenvironment.RootFS;\n"
              "import com.winlator.xenvironment.RootFSInstaller;\n\n"
              "import org.json.JSONException;\n"
              "import org.json.JSONObject;\n",
              1
          )

          s = s.replace(
              "    private Fragment currentFragment;\n",
              "    private Fragment currentFragment;\n    private boolean dianaAutoBootStarted = false;\n",
              1
          )

          # On normal launch: install/update RootFS, then auto boot. If opened from PC Settings, stay in settings.
          startup_line = "            if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);"
          if startup_line not in s:
              raise SystemExit("MainActivity startup line not found")
          startup_block = '''            int editContainerId = intent.getIntExtra("edit_container_id", 0);
              boolean skipAutoBoot = intent.getBooleanExtra("diana_skip_autoboot", false);
              if (!requestAppPermissions()) {
                  RootFSInstaller.installIfNeeded(this);
                  if (editContainerId > 0) showFragment(new ContainerDetailFragment(editContainerId));
                  else if (!skipAutoBoot) startDianaPcWhenReady();
              }'''
          s = s.replace(startup_line, startup_block, 1)

          # Permission callback: same flow after permission approval.
          permission_old = '''                RootFSInstaller.installIfNeeded(this);'''
          permission_new = '''                RootFSInstaller.installIfNeeded(this);
                  Intent intent = getIntent();
                  int editContainerId = intent.getIntExtra("edit_container_id", 0);
                  boolean skipAutoBoot = intent.getBooleanExtra("diana_skip_autoboot", false);
                  if (editContainerId > 0) showFragment(new ContainerDetailFragment(editContainerId));
                  else if (!skipAutoBoot) startDianaPcWhenReady();'''
          # Replace the next remaining occurrence (the one in onRequestPermissionsResult).
          if permission_old not in s:
              raise SystemExit("MainActivity permission install line not found")
          s = s.replace(permission_old, permission_new, 1)

          # Insert auto-container/boot helpers immediately before requestAppPermissions().
          helper_marker = "    private boolean requestAppPermissions() {"
          if helper_marker not in s:
              raise SystemExit("MainActivity helper marker not found")
          helpers = '''    private void startDianaPcWhenReady() {
              if (dianaAutoBootStarted) return;
              dianaAutoBootStarted = true;

              final android.os.Handler handler = new android.os.Handler(getMainLooper());
              handler.post(new Runnable() {
                  @Override
                  public void run() {
                      if (isFinishing() || (android.os.Build.VERSION.SDK_INT >= 17 && isDestroyed())) return;

                      RootFS rootFS = RootFS.find(MainActivity.this);
                      if (!rootFS.isValid() || rootFS.getVersion() < RootFSInstaller.LATEST_VERSION) {
                          handler.postDelayed(this, 1000);
                          return;
                      }

                      ContainerManager manager = new ContainerManager(MainActivity.this);
                      if (!manager.getContainers().isEmpty()) {
                          Container existing = manager.getContainers().get(0);
                          configureDianaContainer(existing);
                          launchDianaContainer(existing);
                          return;
                      }

                      try {
                          JSONObject data = new JSONObject();
                          data.put("name", "Diana PC");
                          data.put("screenSize", Container.DEFAULT_SCREEN_SIZE);
                          data.put("envVars", Container.DEFAULT_ENV_VARS);
                          data.put("wincomponents", Container.DEFAULT_WINCOMPONENTS);
                          data.put("drives", Container.DEFAULT_DRIVES);
                          data.put("box64Preset", Box64Preset.PERFORMANCE);

                          preloaderDialog.show(R.string.creating_container);
                          manager.createContainerAsync(data, (container) -> {
                              preloaderDialog.closeOnUiThread();
                              if (container != null) {
                                  configureDianaContainer(container);
                                  launchDianaContainer(container);
                              }
                              else dianaAutoBootStarted = false;
                          });
                      }
                      catch (JSONException e) {
                          dianaAutoBootStarted = false;
                      }
                  }
              });
          }

          private void configureDianaContainer(Container container) {
              if (GPUHelper.getAdrenoModelId(this) <= 0 && !container.getExtra("dianaMaliSafeV7").equals("t")) {
                  container.setGraphicsDriver(GraphicsDrivers.VORTEK + "," + GraphicsDrivers.VIRGL);
                  container.setGraphicsDriverConfig("");
                  container.setDXWrapper(DXWrappers.WINED3D);
                  container.setDXWrapperConfig("");
                  container.setBox64Preset(Box64Preset.INTERMEDIATE);
                  if (container.getScreenSize().equals(Container.DEFAULT_SCREEN_SIZE)) {
                      container.setScreenSize("1024x576");
                  }

                  EnvVars safeVars = new EnvVars(container.getEnvVars());
                  safeVars.put("MESA_GLSL_VERSION_OVERRIDE", "410");
                  safeVars.put("mesa_glthread", "false");
                  safeVars.put("BOX64_MMAP32", "1");
                  safeVars.put("BOX64_SAFEFLAGS", "2");
                  safeVars.put("WINEDEBUG", "-all");
                  container.setEnvVars(safeVars.toString());

                  container.putExtra("dianaMaliSafeV7", "t");
                  container.putExtra("dxwrapper", null);
                  container.saveData();
              }
          }

          private void launchDianaContainer(Container container) {
              Intent intent = new Intent(this, XServerDisplayActivity.class);
              intent.putExtra("container_id", container.id);
              startActivity(intent);
          }

          '''
          s = s.replace(helper_marker, helpers + helper_marker, 1)
          main.write_text(s)
          PY

          cat > DIANA-PC-NOTES.md <<'EOF'
          # Diana PC v0.8

          Based on Winlator 11.2.

          - Creates a Diana PC container automatically on first launch.
          - Boots directly into the Wine desktop after system installation.
          - Keeps Winlator's original com.winlator runtime identity so native/rootfs paths stay valid.
          - Detects non-Adreno GPUs and performs a one-time Mali-safe migration.
          - Mali-safe mode uses VirGL + WineD3D + Box64 Stability.
          - Prevents Vortek from starting beside VirGL during the safe boot path.
          - D: = Android Downloads.
          - E: = Android shared internal storage.
          - Fixes runtime paths/authorities after package rename.
          - "Chrome / Internet" uses Winlator's Android browser bridge; downloads land in D:.
          - Adds "PC Settings" inside the running session for wallpaper/theme/container settings.
          - Desktop starts with Computer, Downloads, Chrome, ChatGPT, Keyboard, Control Panel, Notepad, Terminal and Steam installer icons.
          - Removed Android-game desktop mirroring and automatic keyboard popups.
          - One-finger hold-and-drag works for windows, maps and draggable UI.
          - Installed-app scanning runs only once per minute to reduce desktop stutter.
          - Mali mode uses a lighter 1024x576 desktop and Box64 Intermediate for smoother interaction.
          - Full-size non-system Windows app windows automatically receive the upstream Virtual Gamepad profile.
          - EXE/MSI/BAT/CMD files downloaded to D: automatically receive desktop shortcuts.
          - Newly installed Start Menu apps are mirrored to the desktop automatically while Diana PC is open.
          - Uses upstream Virtual Gamepad as the fallback control profile for launched shortcuts.
          - Adds Astra Control using the OpenAI Responses API + computer tool, with screenshot feedback and native XServer mouse/keyboard execution.\n          - Astra is limited to the Wine/XServer desktop and has a hard stop button plus a 30-step cap.\n          - Retains upstream Wine, Box64, Mesa, DXVK, VKD3D, input controls and licensing/credits.
          EOF

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp upstream/app/build/outputs/apk/debug/app-debug.apk Diana-PC-v0.8.apk
          sha256sum Diana-PC-v0.8.apk | tee Diana-PC-v0.8.sha256
          ls -lh Diana-PC-v0.8.apk

      - name: Upload APK for ChatGPT handoff
        uses: actions/upload-artifact@v4
        with:
          name: Diana-PC-v0.8-chat
          path: Diana-PC-v0.8.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete diana-pc-v0.8 --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create diana-pc-v0.8             Diana-PC-v0.8.apk             Diana-PC-v0.8.sha256             --repo "$GITHUB_REPOSITORY"             --target diana-pc-public             --title "Diana PC v0.8"             --notes "Diana PC v0.8: adiciona Astra Control para o GPT-6 Astra operar o desktop Wine via screenshots e ações de mouse/teclado usando a OpenAI Responses API; inclui botão PARAR, limite de 30 passos e mantém as otimizações do POCO C65."
