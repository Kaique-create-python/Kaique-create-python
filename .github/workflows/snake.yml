name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kaique-create-python
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate profile analytics
        shell: bash
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import os
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          username = "Kaique-create-python"
          today = dt.date.today()
          start = today - dt.timedelta(days=364)
          end = today + dt.timedelta(days=1)

          class CalendarParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  classes = attributes.get("class", "")
                  if "ContributionCalendar-day" not in classes:
                      return
                  if not attributes.get("data-date"):
                      return
                  self.days.append({
                      "date": attributes["data-date"],
                      "level": int(attributes.get("data-level", "0")),
                  })

          params = urllib.parse.urlencode({
              "from": start.isoformat(),
              "to": today.isoformat(),
          })
          contributions_url = (
              f"https://github.com/users/{username}/contributions?{params}"
          )
          request = urllib.request.Request(
              contributions_url,
              headers={
                  "Accept": "text/html",
                  "Accept-Language": "en-US,en;q=0.9",
                  "User-Agent": "Kaique-profile-workflow",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              calendar_html = response.read().decode("utf-8")

          parser = CalendarParser()
          parser.feed(calendar_html)

          if not parser.days:
              raise RuntimeError("GitHub contribution calendar returned no days")

          unique_days = {
              item["date"]: item["level"]
              for item in parser.days
          }
          parsed_days = []
          week_map = {}

          for date_text, level in sorted(unique_days.items()):
              date_value = dt.date.fromisoformat(date_text)
              day = {
                  "date": date_text,
                  "contributionCount": level,
                  "weekday": date_value.weekday(),
              }
              parsed_days.append(day)
              monday = date_value - dt.timedelta(days=date_value.weekday())
              week_map.setdefault(monday.isoformat(), []).append(day)

          weeks = [
              {"contributionDays": week_map[key]}
              for key in sorted(week_map)
          ]
          days = parsed_days
          counts = {
              day["date"]: int(day["contributionCount"])
              for day in days
          }
          active_days = sum(1 for count in counts.values() if count > 0)
          best_day = max(counts.values(), default=0)

          cursor = today
          if counts.get(cursor.isoformat(), 0) == 0:
              cursor -= dt.timedelta(days=1)

          current_streak = 0
          while counts.get(cursor.isoformat(), 0) > 0:
              current_streak += 1
              cursor -= dt.timedelta(days=1)

          max_count = max(counts.values(), default=0)

          def color_for(count):
              if count == 0:
                  return "#161B22"
              ratio = count / max(max_count, 1)
              if ratio <= 0.25:
                  return "#0E7490"
              if ratio <= 0.50:
                  return "#0891B2"
              if ratio <= 0.75:
                  return "#22D3EE"
              return "#67E8F9"

          os.makedirs("dist", exist_ok=True)

          cell = 11
          gap = 4
          left = 115
          top = 72
          graph_width = 960
          graph_height = 205
          rects = []

          for week_index, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  count = int(day["contributionCount"])
                  x = left + week_index * (cell + gap)
                  y = top + int(day["weekday"]) * (cell + gap)
                  date = html.escape(day["date"])
                  rects.append(
                      f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" '
                      f'fill="{color_for(count)}"><title>{date}: nível de atividade {count}</title></rect>'
                  )

          graph = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="205" viewBox="0 0 960 205" role="img" aria-label="Atividade anual no GitHub">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.title{font-size:18px;font-weight:700;fill:#00D9FF}.sub{font-size:12px;fill:#8B949E}.label{font-size:10px;fill:#8B949E}</style>',
              '<rect width="960" height="205" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="203" rx="11" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>',
              '<text x="28" y="34" class="title">CONTRIBUTION ACTIVITY // 365 DAYS</text>',
              f'<text x="28" y="54" class="sub">{active_days} dias com atividade no período</text>',
              '<text x="28" y="88" class="label">SEG</text>',
              '<text x="28" y="118" class="label">QUA</text>',
              '<text x="28" y="148" class="label">SEX</text>',
          ]
          graph.extend(rects)
          graph.extend([
              '<text x="720" y="190" class="label">MENOS</text>',
              '<rect x="765" y="181" width="10" height="10" rx="2" fill="#161B22"/>',
              '<rect x="781" y="181" width="10" height="10" rx="2" fill="#0E7490"/>',
              '<rect x="797" y="181" width="10" height="10" rx="2" fill="#0891B2"/>',
              '<rect x="813" y="181" width="10" height="10" rx="2" fill="#22D3EE"/>',
              '<rect x="829" y="181" width="10" height="10" rx="2" fill="#67E8F9"/>',
              '<text x="847" y="190" class="label">MAIS</text>',
              '</svg>',
          ])

          with open("dist/activity-graph.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(graph))

          metrics = [
              ("DIAS ATIVOS", active_days, "últimos 365 dias"),
              ("SEMANAS", len(weeks), "período monitorado"),
              ("SEQUÊNCIA ATUAL", current_streak, "dias consecutivos"),
              ("PICO DE ATIVIDADE", best_day, "nível máximo registrado"),
          ]

          milestone = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Marcos do perfil no GitHub">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.title{font-size:18px;font-weight:700;fill:#00D9FF}.value{font-size:28px;font-weight:800;fill:#F0F6FC}.name{font-size:11px;font-weight:700;fill:#00D9FF}.desc{font-size:10px;fill:#8B949E}</style>',
              '<rect width="960" height="210" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="208" rx="11" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>',
              '<text x="28" y="36" class="title">PROFILE MILESTONES // VERIFIED DATA</text>',
          ]

          for index, (name, value, description) in enumerate(metrics):
              x = 28 + index * 232
              milestone.extend([
                  f'<rect x="{x}" y="62" width="210" height="112" rx="10" fill="#161B22" stroke="#00D9FF" stroke-opacity=".32"/>',
                  f'<text x="{x + 18}" y="91" class="name">{html.escape(name)}</text>',
                  f'<text x="{x + 18}" y="130" class="value">{value}</text>',
                  f'<text x="{x + 18}" y="154" class="desc">{html.escape(description)}</text>',
              ])

          milestone.extend([
              '<text x="28" y="197" class="desc">Dados gerados diariamente pela API oficial do GitHub</text>',
              '</svg>',
          ])

          with open("dist/profile-milestones.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(milestone))
          PY

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

  audit-readme:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check final profile cards
        shell: bash
        run: |
          set -euo pipefail

          check_svg() {
            name="$1"
            url="$2"
            file="$(mktemp)"
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -L -sS -A "GitHub-README-audit" -o "$file" -w "%{http_code}" "$url")"

            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "::error::$name returned HTTP $status"
              exit 1
            fi

            if ! grep -qi "<svg" "$file"; then
              echo "::error::$name did not return SVG content"
              exit 1
            fi

            if grep -Eqi "Something went wrong|Rate limit exceeded|Error fetching|card is unavailable|upstream error" "$file"; then
              echo "::error::$name returned an error card"
              exit 1
            fi

            echo "$name: OK ($status)"
          }

          check_svg "Profile Details" "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=Kaique-create-python&theme=github_dark"
          check_svg "Profile Stats" "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Kaique-create-python&theme=github_dark"
          check_svg "Top Languages" "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Kaique-create-python&theme=github_dark"
          check_svg "GitHub Streak" "https://streak-stats.demolab.com?user=Kaique-create-python&hide_border=true&background=0D1117&ring=00D9FF&fire=00D9FF&currStreakLabel=00D9FF&sideLabels=C9D1D9&currStreakNum=F0F6FC&sideNums=F0F6FC&dates=8B949E&border_radius=8&locale=pt_BR"
          check_svg "Activity Graph" "https://raw.githubusercontent.com/Kaique-create-python/Kaique-create-python/output/activity-graph.svg"
          check_svg "Profile Milestones" "https://raw.githubusercontent.com/Kaique-create-python/Kaique-create-python/output/profile-milestones.svg"
          check_svg "Contribution Snake" "https://raw.githubusercontent.com/Kaique-create-python/Kaique-create-python/output/github-contribution-grid-snake-dark.svg"
