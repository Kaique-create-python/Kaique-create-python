name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kaique-create-python
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate profile analytics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import os
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          username = "Kaique-create-python"
          today = dt.date.today()
          start = today - dt.timedelta(days=364)
          end = today + dt.timedelta(days=1)

          class CalendarParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  classes = attributes.get("class", "")
                  if "ContributionCalendar-day" not in classes:
                      return
                  if not attributes.get("data-date"):
                      return
                  self.days.append({
                      "date": attributes["data-date"],
                      "level": int(attributes.get("data-level", "0")),
                  })

          params = urllib.parse.urlencode({
              "from": start.isoformat(),
              "to": today.isoformat(),
          })
          contributions_url = (
              f"https://github.com/users/{username}/contributions?{params}"
          )
          request = urllib.request.Request(
              contributions_url,
              headers={
                  "Accept": "text/html",
                  "Accept-Language": "en-US,en;q=0.9",
                  "User-Agent": "Kaique-profile-workflow",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              calendar_html = response.read().decode("utf-8")

          parser = CalendarParser()
          parser.feed(calendar_html)

          if not parser.days:
              raise RuntimeError("GitHub contribution calendar returned no days")

          unique_days = {
              item["date"]: item["level"]
              for item in parser.days
          }
          parsed_days = []
          week_map = {}

          for date_text, level in sorted(unique_days.items()):
              date_value = dt.date.fromisoformat(date_text)
              day = {
                  "date": date_text,
                  "contributionCount": level,
                  "weekday": date_value.weekday(),
              }
              parsed_days.append(day)
              monday = date_value - dt.timedelta(days=date_value.weekday())
              week_map.setdefault(monday.isoformat(), []).append(day)

          weeks = [
              {"contributionDays": week_map[key]}
              for key in sorted(week_map)
          ]
          days = parsed_days
          counts = {
              day["date"]: int(day["contributionCount"])
              for day in days
          }
          active_days = sum(1 for count in counts.values() if count > 0)
          best_day = max(counts.values(), default=0)

          cursor = today
          if counts.get(cursor.isoformat(), 0) == 0:
              cursor -= dt.timedelta(days=1)

          current_streak = 0
          while counts.get(cursor.isoformat(), 0) > 0:
              current_streak += 1
              cursor -= dt.timedelta(days=1)

          max_count = max(counts.values(), default=0)

          def color_for(count):
              if count == 0:
                  return "#161B22"
              ratio = count / max(max_count, 1)
              if ratio <= 0.25:
                  return "#0E7490"
              if ratio <= 0.50:
                  return "#0891B2"
              if ratio <= 0.75:
                  return "#22D3EE"
              return "#67E8F9"

          os.makedirs("dist", exist_ok=True)

          cell = 11
          gap = 4
          left = 115
          top = 72
          graph_width = 960
          graph_height = 205
          rects = []

          for week_index, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  count = int(day["contributionCount"])
                  x = left + week_index * (cell + gap)
                  y = top + int(day["weekday"]) * (cell + gap)
                  date = html.escape(day["date"])
                  rects.append(
                      f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" '
                      f'fill="{color_for(count)}"><title>{date}: nível de atividade {count}</title></rect>'
                  )

          graph = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="205" viewBox="0 0 960 205" role="img" aria-label="Atividade anual no GitHub">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.title{font-size:18px;font-weight:700;fill:#00D9FF}.sub{font-size:12px;fill:#8B949E}.label{font-size:10px;fill:#8B949E}</style>',
              '<rect width="960" height="205" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="203" rx="11" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>',
              '<text x="28" y="34" class="title">CONTRIBUTION ACTIVITY // 365 DAYS</text>',
              f'<text x="28" y="54" class="sub">{active_days} dias com atividade no período</text>',
              '<text x="28" y="88" class="label">SEG</text>',
              '<text x="28" y="118" class="label">QUA</text>',
              '<text x="28" y="148" class="label">SEX</text>',
          ]
          graph.extend(rects)
          graph.extend([
              '<text x="720" y="190" class="label">MENOS</text>',
              '<rect x="765" y="181" width="10" height="10" rx="2" fill="#161B22"/>',
              '<rect x="781" y="181" width="10" height="10" rx="2" fill="#0E7490"/>',
              '<rect x="797" y="181" width="10" height="10" rx="2" fill="#0891B2"/>',
              '<rect x="813" y="181" width="10" height="10" rx="2" fill="#22D3EE"/>',
              '<rect x="829" y="181" width="10" height="10" rx="2" fill="#67E8F9"/>',
              '<text x="847" y="190" class="label">MAIS</text>',
              '</svg>',
          ])

          with open("dist/activity-graph.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(graph))

          metrics = [
              ("DIAS ATIVOS", active_days, "últimos 365 dias"),
              ("SEMANAS", len(weeks), "período monitorado"),
              ("SEQUÊNCIA ATUAL", current_streak, "dias consecutivos"),
              ("PICO DE ATIVIDADE", best_day, "nível máximo registrado"),
          ]

          milestone = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Marcos do perfil no GitHub">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.title{font-size:18px;font-weight:700;fill:#00D9FF}.value{font-size:28px;font-weight:800;fill:#F0F6FC}.name{font-size:11px;font-weight:700;fill:#00D9FF}.desc{font-size:10px;fill:#8B949E}</style>',
              '<rect width="960" height="210" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="208" rx="11" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>',
              '<text x="28" y="36" class="title">PROFILE MILESTONES // VERIFIED DATA</text>',
          ]

          for index, (name, value, description) in enumerate(metrics):
              x = 28 + index * 232
              milestone.extend([
                  f'<rect x="{x}" y="62" width="210" height="112" rx="10" fill="#161B22" stroke="#00D9FF" stroke-opacity=".32"/>',
                  f'<text x="{x + 18}" y="91" class="name">{html.escape(name)}</text>',
                  f'<text x="{x + 18}" y="130" class="value">{value}</text>',
                  f'<text x="{x + 18}" y="154" class="desc">{html.escape(description)}</text>',
              ])

          milestone.extend([
              '<text x="28" y="197" class="desc">Dados gerados diariamente pela API oficial do GitHub</text>',
              '</svg>',
          ])

          with open("dist/profile-milestones.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(milestone))

          def write_asset(filename, parts):
              content = "\n".join(parts) if isinstance(parts, list) else parts
              with open(f"dist/{filename}", "w", encoding="utf-8") as file:
                  file.write(content)

          hero_grid = []
          for x in range(0, 961, 40):
              hero_grid.append(
                  f'<line x1="{x}" y1="0" x2="{x}" y2="260" stroke="#00D9FF" stroke-opacity=".055"/>'
              )
          for y in range(0, 261, 40):
              hero_grid.append(
                  f'<line x1="0" y1="{y}" x2="960" y2="{y}" stroke="#00D9FF" stroke-opacity=".055"/>'
              )

          hero = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Banner de Kaique Pereira Ramos">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.kicker{font-size:11px;letter-spacing:2px;fill:#8B949E}.name{font-size:34px;font-weight:800;fill:#F0F6FC}.role{font-size:15px;font-weight:600;letter-spacing:1.2px;fill:#00D9FF}.meta{font-size:11px;fill:#8B949E}.label{font-size:9px;letter-spacing:1.4px;fill:#8B949E}.value{font-size:12px;font-weight:700;fill:#F0F6FC}.cursor{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}</style>',
              '<rect width="960" height="260" rx="14" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="258" rx="13" fill="none" stroke="#00D9FF" stroke-opacity=".42"/>',
              '<g>',
          ]
          hero.extend(hero_grid)
          hero.extend([
              '</g>',
              '<path d="M1 48H18L34 32H245" fill="none" stroke="#00D9FF" stroke-opacity=".55"/>',
              '<path d="M959 212H942L926 228H715" fill="none" stroke="#00D9FF" stroke-opacity=".55"/>',
              '<rect x="0" y="0" width="4" height="260" rx="2" fill="#00D9FF"/>',
              '<text x="46" y="34" class="kicker">KPR // DEVELOPER PROFILE // BRASIL</text>',
              '<text x="46" y="88" class="name">KAIQUE PEREIRA RAMOS</text>',
              '<text x="46" y="120" class="role">DESENVOLVEDOR EM FORMAÇÃO<tspan class="cursor">_</tspan></text>',
              '<text x="46" y="151" class="meta">PYTHON  //  BACKEND  //  AUTOMAÇÕES  //  INTELIGÊNCIA ARTIFICIAL</text>',
              '<circle cx="822" cy="104" r="69" fill="none" stroke="#00D9FF" stroke-opacity=".22"/>',
              '<circle cx="822" cy="104" r="48" fill="none" stroke="#00D9FF" stroke-opacity=".38"/>',
              '<circle cx="822" cy="104" r="20" fill="none" stroke="#00D9FF" stroke-opacity=".62"/>',
              '<path d="M742 104H902M822 24V184" stroke="#00D9FF" stroke-opacity=".18"/>',
              '<path d="M822 36A68 68 0 0 1 890 104" fill="none" stroke="#00D9FF" stroke-width="3"/>',
              '<circle cx="847" cy="82" r="4" fill="#67E8F9"/>',
              '<circle cx="788" cy="125" r="3" fill="#0891B2"/>',
              '<text x="760" y="193" class="label">SIGNAL // STABLE</text>',
              '<rect x="46" y="184" width="250" height="48" rx="7" fill="#161B22" stroke="#00D9FF" stroke-opacity=".25"/>',
              '<text x="62" y="202" class="label">PYTHON CORE</text>',
              '<text x="62" y="221" class="value">INTERMEDIÁRIO</text>',
              '<rect x="316" y="184" width="250" height="48" rx="7" fill="#161B22" stroke="#00D9FF" stroke-opacity=".25"/>',
              '<text x="332" y="202" class="label">BACKEND MODULE</text>',
              '<text x="332" y="221" class="value">LEARNING</text>',
              '<rect x="586" y="184" width="250" height="48" rx="7" fill="#161B22" stroke="#00D9FF" stroke-opacity=".25"/>',
              '<text x="602" y="202" class="label">BUILD MODE</text>',
              '<text x="602" y="221" class="value">ACTIVE</text>',
              '<rect x="-30" y="0" width="28" height="260" fill="#00D9FF" opacity=".08"><animate attributeName="x" from="-30" to="990" dur="7s" repeatCount="indefinite"/></rect>',
              '</svg>',
          ])
          write_asset("hero-banner.svg", hero)

          divider = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="38" viewBox="0 0 960 38" role="img" aria-label="Divisor de seção">',
              '<rect width="960" height="38" fill="#0D1117" fill-opacity="0"/>',
              '<path d="M0 19H420L436 5H524L540 19H960" fill="none" stroke="#00D9FF" stroke-opacity=".42"/>',
              '<circle cx="448" cy="5" r="3" fill="#00D9FF"/>',
              '<rect x="470" y="1" width="20" height="8" rx="2" fill="#161B22" stroke="#00D9FF" stroke-opacity=".65"/>',
              '<circle cx="512" cy="5" r="3" fill="#00D9FF"/>',
              '<path d="M438 30H522" stroke="#00D9FF" stroke-opacity=".16"/>',
              '</svg>',
          ]
          write_asset("section-divider.svg", divider)

          def project_card(index, title, status, description, technologies, filename):
              chips = []
              chip_x = 112
              for technology in technologies:
                  width = max(76, 24 + len(technology) * 8)
                  chips.extend([
                      f'<rect x="{chip_x}" y="118" width="{width}" height="28" rx="6" fill="#0D1117" stroke="#00D9FF" stroke-opacity=".35"/>',
                      f'<text x="{chip_x + 12}" y="137" class="chip">{html.escape(technology)}</text>',
                  ])
                  chip_x += width + 10

              card = [
                  '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="174" viewBox="0 0 960 174" role="img" aria-label="Projeto em desenvolvimento">',
                  '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.index{font-size:30px;font-weight:800;fill:#00D9FF}.title{font-size:22px;font-weight:800;fill:#F0F6FC}.desc{font-size:13px;fill:#C9D1D9}.status{font-size:10px;font-weight:700;letter-spacing:1px;fill:#00D9FF}.chip{font-size:10px;font-weight:600;fill:#C9D1D9}.meta{font-size:9px;letter-spacing:1px;fill:#8B949E}</style>',
                  '<rect width="960" height="174" rx="12" fill="#0D1117"/>',
                  '<rect x="1" y="1" width="958" height="172" rx="11" fill="none" stroke="#00D9FF" stroke-opacity=".27"/>',
                  '<rect x="0" y="22" width="5" height="130" rx="2" fill="#00D9FF"/>',
                  f'<text x="30" y="58" class="index">{index}</text>',
                  f'<text x="112" y="52" class="title">{html.escape(title)}</text>',
                  f'<text x="112" y="88" class="desc">{html.escape(description)}</text>',
                  '<rect x="756" y="24" width="174" height="32" rx="6" fill="#161B22" stroke="#00D9FF" stroke-opacity=".42"/>',
                  f'<text x="843" y="44" text-anchor="middle" class="status">{html.escape(status)}</text>',
                  f'<text x="812" y="153" class="meta">MODULE // {index}</text>',
              ]
              card.extend(chips)
              card.append('</svg>')
              write_asset(filename, card)

          project_card(
              "01",
              "NEURA X",
              "EM DESENVOLVIMENTO",
              "Assistente de IA com Python, LLMs locais, APIs e automação.",
              ["PYTHON", "LLM", "API", "AUTOMAÇÃO"],
              "project-neura-x.svg",
          )
          project_card(
              "02",
              "ÓRBITA",
              "EM DESENVOLVIMENTO",
              "Laboratório de gravidade com React, TypeScript, Three.js e física computacional.",
              ["REACT", "TYPESCRIPT", "THREE.JS", "FÍSICA"],
              "project-orbita.svg",
          )
          project_card(
              "03",
              "LABORATÓRIO PYTHON",
              "EM DESENVOLVIMENTO",
              "Algoritmos, automações, backend e experimentos práticos em Python.",
              ["PYTHON", "ALGORITMOS", "BACKEND", "TESTES"],
              "project-python-lab.svg",
          )

          mission_rows = [
              ("PYTHON CORE", "EVOLUINDO", "Código sólido, orientação a objetos e algoritmos"),
              ("BACKEND", "EM FOCO", "APIs, integração de sistemas e automações"),
              ("INTELIGÊNCIA ARTIFICIAL", "PESQUISANDO", "LLMs locais e aplicações práticas"),
              ("MATEMÁTICA APLICADA", "FORTALECENDO", "Vetores, matrizes e plano cartesiano"),
          ]
          mission = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Missão atual de desenvolvimento">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.title{font-size:19px;font-weight:800;fill:#00D9FF}.sub{font-size:11px;fill:#8B949E}.name{font-size:12px;font-weight:700;fill:#F0F6FC}.status{font-size:10px;font-weight:700;fill:#00D9FF}.desc{font-size:11px;fill:#C9D1D9}.prompt{font-size:10px;fill:#8B949E}</style>',
              '<rect width="960" height="300" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="298" rx="11" fill="none" stroke="#00D9FF" stroke-opacity=".3"/>',
              '<text x="34" y="38" class="title">CURRENT MISSION // BUILD A SOLID TECHNICAL PORTFOLIO</text>',
              '<text x="34" y="59" class="sub">Plano ativo de estudo e construção</text>',
          ]
          for row_index, (name, status, description) in enumerate(mission_rows):
              y = 88 + row_index * 48
              mission.extend([
                  f'<rect x="34" y="{y - 20}" width="892" height="40" rx="6" fill="#161B22"/>',
                  f'<text x="52" y="{y + 4}" class="name">{html.escape(name)}</text>',
                  f'<rect x="292" y="{y - 13}" width="142" height="26" rx="5" fill="#0D1117" stroke="#00D9FF" stroke-opacity=".35"/>',
                  f'<text x="363" y="{y + 4}" text-anchor="middle" class="status">{html.escape(status)}</text>',
                  f'<text x="466" y="{y + 4}" class="desc">{html.escape(description)}</text>',
              ])
          mission.extend([
              '<text x="34" y="281" class="prompt">kaique@dev:~$ mission --status active</text>',
              '</svg>',
          ])
          write_asset("current-mission.svg", mission)

          sync_date = today.isoformat()
          footer = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="126" viewBox="0 0 960 126" role="img" aria-label="Rodapé do perfil">',
              '<style>text{font-family:JetBrains Mono,Segoe UI,Arial,sans-serif}.name{font-size:15px;font-weight:800;fill:#F0F6FC}.meta{font-size:10px;letter-spacing:1px;fill:#8B949E}.status{font-size:10px;font-weight:700;fill:#00D9FF}</style>',
              '<rect width="960" height="126" rx="12" fill="#0D1117"/>',
              '<rect x="1" y="1" width="958" height="124" rx="11" fill="none" stroke="#00D9FF" stroke-opacity=".28"/>',
              '<path d="M0 24H28L42 10H185" fill="none" stroke="#00D9FF" stroke-opacity=".5"/>',
              '<path d="M960 102H932L918 116H775" fill="none" stroke="#00D9FF" stroke-opacity=".5"/>',
              '<circle cx="58" cy="66" r="7" fill="#00D9FF"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>',
              '<text x="82" y="60" class="name">KAIQUE PEREIRA RAMOS // DEVELOPER PROFILE</text>',
              '<text x="82" y="82" class="meta">PYTHON  |  BACKEND  |  AUTOMAÇÕES  |  INTELIGÊNCIA ARTIFICIAL</text>',
              '<rect x="700" y="42" width="212" height="42" rx="7" fill="#161B22" stroke="#00D9FF" stroke-opacity=".34"/>',
              '<text x="718" y="59" class="meta">PROFILE SYSTEM</text>',
              '<text x="718" y="76" class="status">ONLINE // VERIFIED</text>',
              f'<text x="700" y="104" class="meta">LAST SYNC // {sync_date}</text>',
              '</svg>',
          ]
          write_asset("footer-status.svg", footer)

          PY

      - name: Validate profile assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = {
              "activity-graph.svg",
              "profile-milestones.svg",
              "hero-banner.svg",
              "section-divider.svg",
              "project-neura-x.svg",
              "project-orbita.svg",
              "project-python-lab.svg",
              "current-mission.svg",
              "footer-status.svg",
              "github-contribution-grid-snake.svg",
              "github-contribution-grid-snake-dark.svg",
          }

          present = {path.name for path in Path("dist").glob("*.svg")}
          missing = required - present
          if missing:
              raise RuntimeError(f"Missing assets: {sorted(missing)}")

          for filename in sorted(required):
              ET.parse(Path("dist") / filename)
              print(f"{filename}: valid")
          PY


      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit-readme:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Audit profile assets
        shell: bash
        run: |
          set -euo pipefail

          check_svg() {
            name="$1"
            url="$2"
            file="$(mktemp)"
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -L -sS -A "GitHub-README-audit" -o "$file" -w "%{http_code}" "$url")"

            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "::error::$name returned HTTP $status"
              exit 1
            fi

            if ! grep -qi "<svg" "$file"; then
              echo "::error::$name did not return SVG content"
              exit 1
            fi

            if grep -Eqi "Something went wrong|Rate limit exceeded|Error fetching|card is unavailable|upstream error" "$file"; then
              echo "::error::$name returned an error card"
              exit 1
            fi

            echo "$name: OK ($status)"
          }

          base="https://raw.githubusercontent.com/Kaique-create-python/Kaique-create-python/output"
          check_svg "Hero Banner" "$base/hero-banner.svg"
          check_svg "Section Divider" "$base/section-divider.svg"
          check_svg "NEURA X Card" "$base/project-neura-x.svg"
          check_svg "ORBITA Card" "$base/project-orbita.svg"
          check_svg "Python Lab Card" "$base/project-python-lab.svg"
          check_svg "Current Mission" "$base/current-mission.svg"
          check_svg "Activity Graph" "$base/activity-graph.svg"
          check_svg "Profile Milestones" "$base/profile-milestones.svg"
          check_svg "Footer Status" "$base/footer-status.svg"
          check_svg "Contribution Snake" "$base/github-contribution-grid-snake-dark.svg"
