name: Build xKiro AI Studio APK

on:
  push:
    branches: [ "xkiro-ai-studio" ]
    paths:
      - "xkiro-ai-studio/**"
      - "xkiro-overrides/**"
      - ".github/workflows/build-xkiro-ai-studio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          base64 -d xkiro-ai-studio/project.tar.gz.b64 > /tmp/xkiro-project.tgz
          tar -xzf /tmp/xkiro-project.tgz -C "$GITHUB_WORKSPACE"

      - name: Apply v0.1.2 source overrides
        shell: bash
        run: |
          cp -a xkiro-overrides/v012/. xkiro-ai-studio/
          echo "Applied typed Device Agent overrides"

      - name: Apply v0.1.3 UI and control overrides
        shell: bash
        run: |
          cat xkiro-overrides/v013.b64.part* > /tmp/xkiro-v013.b64
          base64 -d /tmp/xkiro-v013.b64 > /tmp/xkiro-v013.tgz
          gzip -t /tmp/xkiro-v013.tgz
          tar -xzf /tmp/xkiro-v013.tgz -C xkiro-ai-studio
          echo "Applied ChatGPT-like UI, Shizuku authorization and stop controls"

      - name: Apply v0.1.4 Shizuku fix
        shell: bash
        run: |
          cp -a xkiro-overrides/v014/. xkiro-ai-studio/
          echo "Applied live Shizuku detection and provider"

      - name: Apply v0.1.5 Fast Device Agent
        shell: bash
        run: |
          base64 -d xkiro-overrides/v015.tar.gz.b64 > /tmp/xkiro-v015.tgz
          gzip -t /tmp/xkiro-v015.tgz
          tar -xzf /tmp/xkiro-v015.tgz -C xkiro-ai-studio
          echo "Applied fast batched Device Agent, robust Enter and voice fallbacks"

      - name: Upload restored source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-source
          path: |
            xkiro-ai-studio/app
            xkiro-ai-studio/build.gradle.kts
            xkiro-ai-studio/settings.gradle.kts
            xkiro-ai-studio/gradle.properties
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android SDK diagnostic
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build debug APK
        working-directory: xkiro-ai-studio
        shell: bash
        run: |
          set -o pipefail
          gradle --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/xkiro-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-build-log
          path: xkiro-build.log
          if-no-files-found: ignore

      - name: Upload Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-debug
          path: xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish/update downloadable release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk XKiro-AI-Studio-debug.apk
          if gh release view xkiro-ai-studio-latest >/dev/null 2>&1; then
            gh release upload xkiro-ai-studio-latest XKiro-AI-Studio-debug.apk --clobber
          else
            gh release create xkiro-ai-studio-latest XKiro-AI-Studio-debug.apk \
              --target "$GITHUB_SHA" \
              --title "xKiro AI Studio - Latest Debug Build" \
              --notes "Automatic APK build from the xkiro-ai-studio branch."
          fi
