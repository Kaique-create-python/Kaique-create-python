name: Build xKiro AI Studio APK

on:
  push:
    branches: [ "xkiro-ai-studio" ]
    paths:
      - "xkiro-ai-studio/**"
      - "xkiro-overrides/**"
      - ".github/workflows/build-xkiro-ai-studio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          base64 -d xkiro-ai-studio/project.tar.gz.b64 > /tmp/xkiro-project.tgz
          tar -xzf /tmp/xkiro-project.tgz -C "$GITHUB_WORKSPACE"

      - name: Apply v0.1.2 source overrides
        shell: bash
        run: |
          cp -a xkiro-overrides/v012/. xkiro-ai-studio/
          echo "Applied typed Device Agent overrides"

      - name: Apply v0.1.3 UI and control overrides
        shell: bash
        run: |
          cat xkiro-overrides/v013.b64.part* > /tmp/xkiro-v013.b64
          base64 -d /tmp/xkiro-v013.b64 > /tmp/xkiro-v013.tgz
          gzip -t /tmp/xkiro-v013.tgz
          tar -xzf /tmp/xkiro-v013.tgz -C xkiro-ai-studio
          echo "Applied ChatGPT-like UI, Shizuku authorization and stop controls"

      - name: Apply v0.1.4 Shizuku fix
        shell: bash
        run: |
          cp -a xkiro-overrides/v014/. xkiro-ai-studio/
          echo "Applied live Shizuku detection and provider"

      - name: Apply v0.1.5 Fast Device Agent
        shell: bash
        run: |
          base64 -d xkiro-overrides/v015.tar.gz.b64 > /tmp/xkiro-v015.tgz
          gzip -t /tmp/xkiro-v015.tgz
          tar -xzf /tmp/xkiro-v015.tgz -C xkiro-ai-studio
          echo "Applied fast batched Device Agent, robust Enter and voice fallbacks"

      - name: Apply v0.1.6 Screen Vision
        shell: bash
        run: |
          cat xkiro-overrides/v016.b64.part* > /tmp/xkiro-v016.b64
          base64 -d /tmp/xkiro-v016.b64 > /tmp/xkiro-v016.tgz
          gzip -t /tmp/xkiro-v016.tgz
          tar -xzf /tmp/xkiro-v016.tgz -C xkiro-ai-studio
          echo "Applied 1 FPS screen vision, on-demand screenshots and dual vision models"

      - name: Apply v0.1.7 OpenRouter Work + budget routing
        shell: bash
        run: |
          cat xkiro-overrides/v017.b64.part* > /tmp/xkiro-v017.b64
          base64 -d /tmp/xkiro-v017.b64 > /tmp/xkiro-v017.tgz
          gzip -t /tmp/xkiro-v017.tgz
          tar -xzf /tmp/xkiro-v017.tgz -C xkiro-ai-studio
          echo "Applied OpenRouter cost-aware routing, Work files, dual vision and xKiro fallback"

      - name: Apply v0.1.8 Shared Memory + Advanced Gestures
        shell: bash
        run: |
          cat xkiro-overrides/v018.b64.part* > /tmp/xkiro-v018.b64
          base64 -d /tmp/xkiro-v018.b64 > /tmp/xkiro-v018.tgz
          gzip -t /tmp/xkiro-v018.tgz
          tar -xzf /tmp/xkiro-v018.tgz -C xkiro-ai-studio
          echo "Applied shared agent memory and advanced touch gestures"

      - name: Apply v0.1.9 Adaptive Router + ElevenLabs + Device Freedom
        shell: bash
        run: |
          cat xkiro-overrides/v019.b64.part* > /tmp/xkiro-v019.b64
          base64 -d /tmp/xkiro-v019.b64 > /tmp/xkiro-v019.tgz
          gzip -t /tmp/xkiro-v019.tgz
          tar -xzf /tmp/xkiro-v019.tgz -C xkiro-ai-studio
          echo "Applied adaptive 1/2/3 model router, ElevenLabs diagnostics and stronger device input"

      - name: Apply v0.1.9 compile fix
        shell: bash
        run: |
          cat xkiro-overrides/v019fix.b64.part* > /tmp/xkiro-v019fix.b64
          base64 -d /tmp/xkiro-v019fix.b64 > /tmp/xkiro-v019fix.tgz
          gzip -t /tmp/xkiro-v019fix.tgz
          tar -xzf /tmp/xkiro-v019fix.tgz -C xkiro-ai-studio
          echo "Applied Kotlin multiline prompt fix"

      - name: Apply v0.2.0 Device Vision + Termux + ElevenLabs fixes
        shell: bash
        run: |
          cat xkiro-overrides/v020.b64.part* > /tmp/xkiro-v020.b64
          base64 -d /tmp/xkiro-v020.b64 > /tmp/xkiro-v020.tgz
          gzip -t /tmp/xkiro-v020.tgz
          tar -xzf /tmp/xkiro-v020.tgz -C xkiro-ai-studio
          echo "Applied full-display Screen Vision, Shizuku UserService, Termux RUN_COMMAND, image picker and ElevenLabs real-audio diagnostics"

      - name: Apply v0.2.1 Doctor + Web Research + Accessibility Recovery
        shell: bash
        run: |
          cat xkiro-overrides/v021.b64.part00 xkiro-overrides/v021.b64.part01 xkiro-overrides/v021.b64.part02 xkiro-overrides/v021.b64.part03 xkiro-overrides/v021.b64.part04 xkiro-overrides/v021.b64.part05 > /tmp/xkiro-v021.b64
          base64 -d /tmp/xkiro-v021.b64 > /tmp/xkiro-v021.tgz
          gzip -t /tmp/xkiro-v021.tgz
          tar -xzf /tmp/xkiro-v021.tgz -C xkiro-ai-studio
          echo "Applied Doctor recovery, robust accessibility detection, Shizuku vision fallback, web research and UI animations"

      - name: Upload restored source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-source
          path: |
            xkiro-ai-studio/app
            xkiro-ai-studio/build.gradle.kts
            xkiro-ai-studio/settings.gradle.kts
            xkiro-ai-studio/gradle.properties
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android SDK diagnostic
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build debug APK
        working-directory: xkiro-ai-studio
        shell: bash
        run: |
          set -o pipefail
          gradle --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/xkiro-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-build-log
          path: xkiro-build.log
          if-no-files-found: ignore

      - name: Upload Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xKiro-AI-Studio-debug
          path: xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish/update downloadable release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk XKiro-AI-Studio-debug.apk
          if gh release view xkiro-ai-studio-latest >/dev/null 2>&1; then
            gh release upload xkiro-ai-studio-latest XKiro-AI-Studio-debug.apk --clobber
          else
            gh release create xkiro-ai-studio-latest XKiro-AI-Studio-debug.apk \
              --target "$GITHUB_SHA" \
              --title "xKiro AI Studio - Latest Debug Build" \
              --notes "Automatic APK build from the xkiro-ai-studio branch."
          fi
