name: Build Diana APK
on:
  push:
    branches: [ "xkiro-ai-studio" ]
    paths: [ "xkiro-ai-studio/**", "xkiro-overrides/**", ".github/workflows/build-xkiro-ai-studio.yml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          base64 -d xkiro-ai-studio/project.tar.gz.b64 > /tmp/base.tgz
          tar -xzf /tmp/base.tgz -C "$GITHUB_WORKSPACE"
      - { name: Apply v0.1.2, run: "cp -a xkiro-overrides/v012/. xkiro-ai-studio/" }
      - { name: Apply v0.1.3, run: "cat xkiro-overrides/v013.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.4, run: "cp -a xkiro-overrides/v014/. xkiro-ai-studio/" }
      - { name: Apply v0.1.5, run: "base64 -d xkiro-overrides/v015.tar.gz.b64 | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.6, run: "cat xkiro-overrides/v016.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.7, run: "cat xkiro-overrides/v017.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.8, run: "cat xkiro-overrides/v018.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.9, run: "cat xkiro-overrides/v019.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.1.9 compile fix, run: "cat xkiro-overrides/v019fix.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.2.0, run: "cat xkiro-overrides/v020.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.2.1, run: "cat xkiro-overrides/v021.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.2.2, run: "python3 xkiro-overrides/v022-apply.py" }
      - { name: Apply v0.2.3, run: "cat xkiro-overrides/v023.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - { name: Apply v0.2.4, run: "python3 xkiro-overrides/v024-apply.py" }
      - { name: Apply v0.2.5, run: "python3 xkiro-overrides/v025-apply.py" }
      - { name: Apply v0.2.6, run: "python3 xkiro-overrides/v026-apply.py" }
      - { name: Apply v0.2.7, run: "python3 xkiro-overrides/v027-apply.py" }
      - { name: Apply v0.2.8, run: "python3 xkiro-overrides/v028-apply.py" }
      - { name: Apply v0.2.9a, run: "python3 xkiro-overrides/v029a-apply.py" }
      - { name: Apply v0.2.9b, run: "python3 xkiro-overrides/v029b-apply.py" }
      - { name: Apply v0.2.9c, run: "python3 xkiro-overrides/v029c-apply.py" }
      - { name: Apply v0.2.9d, run: "python3 xkiro-overrides/v029d-apply.py" }
      - { name: Apply v0.2.9e, run: "python3 xkiro-overrides/v029e-apply.py" }
      - name: Preserve working v0.2.9 runtime
        run: cp xkiro-ai-studio/app/src/main/java/ai/xkiro/studio/MainActivity.kt /tmp/MainActivity-v029.kt
      - { name: Apply v0.3.0 Diana UI, run: "python3 xkiro-overrides/v030-apply.py" }
      - name: Restore working runtime
        run: cp /tmp/MainActivity-v029.kt xkiro-ai-studio/app/src/main/java/ai/xkiro/studio/MainActivity.kt
      - { name: Bind Diana UI safely, run: "python3 xkiro-overrides/v030post-apply.py" }
      - { name: Apply v0.3.1 pixel-match UI, run: "python3 xkiro-overrides/v031-apply.py" }
      - { name: Apply v0.3.2 final visual pass, run: "python3 xkiro-overrides/v032-apply.py" }
      - { name: Apply v0.3.3 voice and settings UI, run: "cat xkiro-overrides/v033.b64.part* | base64 -d | tar -xz -C xkiro-ai-studio" }
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Diana-v0.3.3-source
          path: |
            xkiro-ai-studio/app
            xkiro-ai-studio/build.gradle.kts
            xkiro-ai-studio/settings.gradle.kts
            xkiro-ai-studio/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.6.0" }
      - name: Build debug APK
        working-directory: xkiro-ai-studio
        run: |
          set -o pipefail
          gradle --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/diana-build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: Diana-v0.3.3-build-log, path: diana-build.log, if-no-files-found: ignore }
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Diana-v0.3.3-debug
          path: xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest release
        if: success()
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp xkiro-ai-studio/app/build/outputs/apk/debug/app-debug.apk Diana-debug.apk
          if gh release view xkiro-ai-studio-latest >/dev/null 2>&1; then gh release upload xkiro-ai-studio-latest Diana-debug.apk --clobber; else gh release create xkiro-ai-studio-latest Diana-debug.apk --target "$GITHUB_SHA" --title "Diana - Latest Debug Build" --notes "Automatic APK build."; fi
