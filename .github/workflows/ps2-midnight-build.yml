name: PS2 Midnight ISO Build

on:
  push:
    branches:
      - ps2-midnight-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl genisoimage file

      - name: Download official PS2DEV toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/ps2dev-toolchain"
          curl -L --fail --retry 3 \
            https://github.com/ps2dev/ps2dev/releases/download/v2.0.0/ps2dev-ubuntu-latest.tar.gz \
            -o /tmp/ps2dev.tar.gz
          tar -xzf /tmp/ps2dev.tar.gz -C "$HOME/ps2dev-toolchain"
          CC_PATH="$(find "$HOME/ps2dev-toolchain" -type f -name mips64r5900el-ps2-elf-gcc | head -n 1)"
          test -n "$CC_PATH"
          PS2DEV_ROOT="$(dirname "$(dirname "$CC_PATH")")"
          PS2SDK_ROOT="$PS2DEV_ROOT/ps2sdk"
          GSKIT_ROOT="$(find "$PS2DEV_ROOT" -maxdepth 1 -type d -iname 'gskit' | head -n 1)"
          test -d "$PS2SDK_ROOT"
          test -d "$GSKIT_ROOT"
          echo "PS2DEV=$PS2DEV_ROOT" >> "$GITHUB_ENV"
          echo "PS2SDK=$PS2SDK_ROOT" >> "$GITHUB_ENV"
          echo "GSKIT=$GSKIT_ROOT" >> "$GITHUB_ENV"
          echo "$PS2DEV_ROOT/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV_ROOT/iop/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV_ROOT/dvp/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK_ROOT/bin" >> "$GITHUB_PATH"

      - name: Recreate game source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ps2_midnight_build
          cat > /tmp/project.tar.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C ps2_midnight_build
          chmod +x ps2_midnight_build/scripts/make_iso.sh

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"
          mips64r5900el-ps2-elf-gcc --version
          test -f "$PS2SDK/samples/Makefile.pref"

      - name: Compile ELF
        working-directory: ps2_midnight_build
        run: |
          set -euxo pipefail
          make clean
          make -j2

      - name: Build ISO
        working-directory: ps2_midnight_build
        run: |
          set -euxo pipefail
          make iso

      - name: Inspect products
        working-directory: ps2_midnight_build
        run: |
          set -euxo pipefail
          ls -lh MIDNIGHT.ELF build/MIDNIGHT_CIRCUIT_PIZZA.iso
          file MIDNIGHT.ELF build/MIDNIGHT_CIRCUIT_PIZZA.iso
          isoinfo -d -i build/MIDNIGHT_CIRCUIT_PIZZA.iso | head -50
          isoinfo -l -i build/MIDNIGHT_CIRCUIT_PIZZA.iso | head -120

      - name: Upload PS2 build
        uses: actions/upload-artifact@v4
        with:
          name: Midnight-Circuit-Pizza-PS2
          if-no-files-found: error
          path: |
            ps2_midnight_build/MIDNIGHT.ELF
            ps2_midnight_build/build/MIDNIGHT_CIRCUIT_PIZZA.iso
            ps2_midnight_build/SYSTEM.CNF
