name: Export ATOM Studio v0.7 PS2Link

on:
  push:
    branches:
      - atom-studio-public-build
    paths:
      - ".github/workflows/export-v07-ps2link.yml"
  workflow_dispatch:

jobs:
  build-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atom-studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build v0.7
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp "app/build/outputs/apk/debug/app-debug.apk" "../ATOM-Studio-v0.7-PS2Link.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATOM-Studio-v0.7-PS2Link
          path: ATOM-Studio-v0.7-PS2Link.apk
          retention-days: 1
