name: Build Neon Terminal APK

on:
  push:
    branches: [neon-terminal-v01]
    paths:
      - 'neon-terminal/**'
      - '.github/workflows/neon-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Neon Terminal Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout customization
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone official Termux source
        run: git clone --depth 1 https://github.com/termux/termux-app.git termux-upstream
      - name: Install SVG converter
        run: python3 -m pip install --user "CairoSVG>=2.7,<3"
      - name: Apply Neon customization
        run: python3 neon-terminal/patch_termux.py termux-upstream neon-terminal/icon.svg
          python3 neon-terminal/enhance_termux.py termux-upstream
      - name: Build APK
        working-directory: termux-upstream
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: neon-terminal-v1.0.0-apt-android-7-debug
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Validate APK
        run: |
          ls -lh termux-upstream/app/build/outputs/apk/debug/
          test -s termux-upstream/app/build/outputs/apk/debug/termux-app_neon-terminal-v1.0.0-apt-android-7-debug_arm64-v8a.apk
          sha256sum termux-upstream/app/build/outputs/apk/debug/*_arm64-v8a.apk
      - name: Attach installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Terminal-v1.0-ARM64-APK
          path: termux-upstream/app/build/outputs/apk/debug/*_arm64-v8a.apk
          if-no-files-found: error
