<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const W = 1280, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const cena = new THREE.Scene(); cena.background = new THREE.Color(0x16181b);
cena.add(new THREE.HemisphereLight(0xdfe8f0, 0x2a2420, 1.4));
const sol = new THREE.DirectionalLight(0xffffff, 2.6); sol.position.set(3, 5, 4); cena.add(sol);
const fill = new THREE.DirectionalLight(0xffe0c0, 0.8); fill.position.set(-4, 1, -3); cena.add(fill);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
function wedge(w, h, d) {
  const g = new THREE.BufferGeometry();
  const x = w / 2, y = h / 2, z = d / 2;
  // base inteira embaixo, face vertical atrás (+Z), rampa da quina de cima de trás até a frente de baixo
  const v = [[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[-x,y,z],[x,y,z]];
  const f = [[0,2,1],[0,3,2],[3,5,2],[3,4,5],[0,1,5],[0,5,4],[0,4,3],[1,2,5]];
  const pos = []; for (const t of f) for (const i of t) pos.push(...v[i]);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
function material(m, c) {
  const cor = new THREE.Color(c[0], c[1], c[2]);
  if (m.includes('Metal')) return new THREE.MeshStandardMaterial({ color: cor, metalness: 0.75, roughness: 0.42 });
  if (m.includes('Wood')) return new THREE.MeshStandardMaterial({ color: cor, metalness: 0, roughness: 0.62 });
  if (m.includes('Fabric')) return new THREE.MeshStandardMaterial({ color: cor, metalness: 0, roughness: 0.95 });
  return new THREE.MeshStandardMaterial({ color: cor, metalness: 0.05, roughness: 0.5 });
}
let grupo = null;
window.montar = (dados) => {
  if (grupo) cena.remove(grupo);
  grupo = new THREE.Group();
  for (const p of dados.pecas) {
    let geo;
    if (p.forma === 'cilindro') { geo = new THREE.CylinderGeometry(p.tam[1] / 2, p.tam[1] / 2, p.tam[0], 28); geo.rotateZ(Math.PI / 2); }
    else if (p.forma === 'cunha') geo = wedge(p.tam[0], p.tam[1], p.tam[2]);
    else geo = new THREE.BoxGeometry(p.tam[0], p.tam[1], p.tam[2]);
    const m = new THREE.Mesh(geo, material(p.material, p.cor));
    const c = p.cf; // x y z r00 r01 r02 r10 r11 r12 r20 r21 r22
    const mat = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
    m.matrixAutoUpdate = false; m.matrix.copy(mat);
    grupo.add(m);
  }
  cena.add(grupo);
};
window.foto = (pos, alvo, fov) => { cam.fov = fov || 30; cam.updateProjectionMatrix(); cam.position.set(...pos); cam.lookAt(...alvo); r.render(cena, cam); };
window.pronto = true;
</script></body></html>
