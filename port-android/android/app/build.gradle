plugins { id 'com.android.application' }
android {
    namespace 'dev.edith.spotifast'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.edith.spotifast'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.14.1-android-free-music-v3.1'
    }
    buildTypes { release { minifyEnabled false } }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
}
