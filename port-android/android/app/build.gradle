plugins { id 'com.android.application' }
android {
    namespace 'dev.edith.spotifast'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.edith.spotifast'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.14.1-android-v5-ui-preview1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stable {
            if (System.getenv('SPOTIFAST_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SPOTIFAST_KEYSTORE_PATH'))
                storePassword System.getenv('SPOTIFAST_STORE_PASSWORD')
                keyAlias System.getenv('SPOTIFAST_KEY_ALIAS')
                keyPassword System.getenv('SPOTIFAST_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('SPOTIFAST_KEYSTORE_PATH')) {
        buildTypes.release.signingConfig signingConfigs.stable
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
