plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veilbreakers.prototype'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.veilbreakers.prototype'
        minSdk 24
        targetSdk 35
        versionCode 23
        versionName '1.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
