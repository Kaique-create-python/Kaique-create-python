plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veilbreakers.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.veilbreakers.prototype'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '1.5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}